<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>فلش‌کوئست | مطالعه با فلش‌کارت</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f5f7;
  --bg-elevated:#ffffff;
  --surface:#ffffff;
  --surface-2:#fbfbfd;
  --border:rgba(0,0,0,.07);
  --border-strong:rgba(0,0,0,.11);
  --text:#1d1d1f;
  --text-dim:#6e6e73;
  --text-dimmer:#a1a1a6;

  --accent:#0071e3;
  --accent-soft:#3d94f0;
  --accent-wash:rgba(0,113,227,.10);

  --success:#2fb350;
  --success-wash:rgba(47,179,80,.12);
  --warning:#ff9500;
  --warning-wash:rgba(255,149,0,.12);
  --danger:#ff3b30;
  --danger-wash:rgba(255,59,48,.12);
  --violet:#6e5de7;
  --violet-soft:#9a8cf2;
  --violet-wash:rgba(110,93,231,.12);

  --card-front:#ffffff;
  --card-back-1:#232326;
  --card-back-2:#3a3a3d;

  --shadow-xs: 0 1px 2px rgba(0,0,0,.04);
  --shadow-sm: 0 2px 8px rgba(0,0,0,.05), 0 1px 2px rgba(0,0,0,.04);
  --shadow-md: 0 10px 30px -12px rgba(0,0,0,.14), 0 2px 6px -1px rgba(0,0,0,.06);
  --shadow-lg: 0 24px 60px -18px rgba(0,0,0,.22), 0 4px 14px -4px rgba(0,0,0,.08);
  --shadow-card: 0 1px 3px rgba(0,0,0,.05), 0 20px 44px -20px rgba(0,0,0,.20);

  --radius-lg: 24px;
  --radius-md: 18px;
  --radius-sm: 13px;
  --radius-xs: 9px;

  --ease: cubic-bezier(.22,.9,.3,1);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(1200px 640px at 82% -8%, rgba(0,113,227,.05), transparent 60%),
    radial-gradient(900px 520px at -8% 105%, rgba(110,93,231,.05), transparent 60%),
    var(--bg);
  color:var(--text);
  font-family:'Vazirmatn','Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  min-height:100vh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
::selection{background:rgba(0,113,227,.18);}
h1,h2,h3,.display{font-family:'Vazirmatn',sans-serif; font-weight:800; letter-spacing:-.01em; color:var(--text);}
button{font-family:inherit; cursor:pointer;}
a{color:inherit; text-decoration:none;}
::-webkit-scrollbar{width:9px; height:9px;}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,.16); border-radius:10px;}
::-webkit-scrollbar-thumb:hover{background:rgba(0,0,0,.24);}
::-webkit-scrollbar-track{background:transparent;}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001s !important; transition-duration:.001s !important;}
}

.icon{width:19px; height:19px; display:inline-block; vertical-align:middle; flex-shrink:0; transition:transform .18s var(--ease);}
.icon-sm{width:15px; height:15px;}
.icon-lg{width:26px; height:26px;}

/* ---------- layout shells ---------- */
.app{min-height:100vh; display:flex; flex-direction:column;}
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 26px; position:sticky; top:0; z-index:40;
  background:rgba(245,245,247,.78); backdrop-filter:saturate(180%) blur(20px); -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--border);
}
.brand{display:flex; align-items:center; gap:10px; font-size:18px; font-weight:800; cursor:pointer; letter-spacing:-.01em; color:var(--text); transition:opacity .15s ease;}
.brand:hover{opacity:.72;}
.brand-mark{
  width:32px; height:32px; border-radius:9px;
  background:linear-gradient(150deg, #2b2b2e, #0071e3 145%);
  display:flex; align-items:center; justify-content:center; color:#fff;
  box-shadow:0 4px 12px -3px rgba(0,113,227,.45);
}
.brand-mark .icon{width:17px; height:17px;}
.nav-links{display:flex; gap:4px; align-items:center; background:rgba(0,0,0,.045); padding:4px; border-radius:100px;}
.nav-btn{
  display:flex; align-items:center; gap:7px; padding:8px 16px; border-radius:100px; border:none;
  background:transparent; color:var(--text-dim); font-size:13.5px; font-weight:600;
  transition:all .22s var(--ease);
}
.nav-btn .icon{width:16px; height:16px;}
.nav-btn:hover{color:var(--text);}
.nav-btn.active{color:var(--text); background:var(--surface); box-shadow:var(--shadow-xs);}
.streak-chip{
  display:flex; align-items:center; gap:6px; padding:7px 14px; border-radius:100px;
  background:var(--warning-wash); border:1px solid rgba(255,149,0,.18); font-size:13.5px; font-weight:700; color:#c96e00;
}
.streak-chip .icon{width:15px; height:15px; color:var(--warning);}

.main{flex:1; padding:34px 26px 90px; max-width:1160px; margin:0 auto; width:100%;}
.view{display:none; animation:viewIn .5s var(--ease);}
.view.active{display:block;}
@keyframes viewIn{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}

/* ---------- buttons / inputs ---------- */
.btn{
  display:inline-flex; align-items:center; gap:8px; padding:11px 20px; border-radius:100px;
  border:none; font-weight:700; font-size:14px; transition:transform .16s var(--ease), box-shadow .2s ease, background .2s ease, opacity .2s ease;
  letter-spacing:-.01em;
}
.btn .icon{width:16px; height:16px;}
.btn:active{transform:scale(.95);}
.btn-primary{background:var(--accent); color:#fff; box-shadow:0 6px 16px -6px rgba(0,113,227,.55);}
.btn-primary:hover{background:#0077ed; box-shadow:0 8px 20px -5px rgba(0,113,227,.6); transform:translateY(-1px);}
.btn-ghost{background:var(--surface); color:var(--text); border:1px solid var(--border-strong); box-shadow:var(--shadow-xs);}
.btn-ghost:hover{background:var(--surface-2); border-color:rgba(0,0,0,.16);}
.btn-danger{background:var(--danger-wash); color:#d6261b; border:1px solid rgba(255,59,48,.2);}
.btn-danger:hover{background:rgba(255,59,48,.18);}
.btn-icon{width:36px; height:36px; padding:0; border-radius:11px; justify-content:center; background:var(--surface); border:1px solid var(--border); color:var(--text-dim); box-shadow:var(--shadow-xs);}
.btn-icon:hover{color:var(--text); background:var(--surface-2); border-color:var(--border-strong);}
.btn-icon:active{transform:scale(.9);}
input[type=text], textarea{
  width:100%; background:var(--surface-2); border:1.5px solid var(--border-strong); color:var(--text);
  border-radius:var(--radius-sm); padding:12px 15px; font-family:inherit; font-size:15px; outline:none;
  transition:border-color .2s ease, box-shadow .2s ease;
}
input[type=text]:focus, textarea:focus{border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-wash);}
textarea{resize:vertical; min-height:80px; line-height:1.6;}
label.field-label{display:block; font-size:12.5px; color:var(--text-dim); margin:0 0 8px 2px; font-weight:700; letter-spacing:.01em;}
.field{margin-bottom:16px;}

/* ---------- home view ---------- */
.hero{margin-bottom:30px;}
.hero h1{font-size:34px; margin:0 0 6px; font-weight:800; letter-spacing:-.02em; color:var(--text);}
.hero p{color:var(--text-dim); font-size:15px; margin:0; font-weight:500;}

.stat-strip{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin:22px 0 34px;}
.stat-card{
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius-md); padding:18px 20px; box-shadow:var(--shadow-sm);
  transition:transform .25s var(--ease), box-shadow .25s var(--ease);
}
.stat-card:hover{transform:translateY(-2px); box-shadow:var(--shadow-md);}
.stat-card .num{font-family:'Inter','Vazirmatn',sans-serif; font-size:25px; font-weight:800; color:var(--text); letter-spacing:-.02em; font-variant-numeric:tabular-nums;}
.stat-card .lbl{font-size:12.5px; color:var(--text-dim); margin-top:3px; font-weight:600;}

.section-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; gap:12px;}
.section-head h2{font-size:21px; margin:0; font-weight:800; letter-spacing:-.01em;}

.topics-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(252px,1fr)); gap:16px;}
.topic-card{
  position:relative; background:var(--surface);
  border:1px solid var(--border); border-radius:var(--radius-lg); padding:22px;
  transition:transform .3s var(--ease), box-shadow .3s var(--ease), border-color .3s var(--ease);
  cursor:pointer; overflow:hidden; box-shadow:var(--shadow-sm);
}
.topic-card:hover{transform:translateY(-5px); box-shadow:var(--shadow-lg); border-color:rgba(0,0,0,.1);}
.topic-card:active{transform:translateY(-1px) scale(.99);}
.topic-top{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:16px;}
.topic-emoji{width:46px; height:46px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:22px;
  background:linear-gradient(150deg, #f0eefe, #e4e0fb); box-shadow:inset 0 0 0 1px rgba(110,93,231,.08);}
.topic-menu-btn{background:none; border:none; color:var(--text-dimmer); padding:5px; border-radius:8px; display:flex; align-items:center;}
.topic-menu-btn:hover{background:rgba(0,0,0,.05); color:var(--text);}
.topic-menu-btn .icon{width:18px; height:18px;}
.topic-card h3{margin:0 0 5px; font-size:18px; font-family:'Vazirmatn'; font-weight:700; letter-spacing:-.01em;}
.topic-card .count{font-size:12.5px; color:var(--text-dim); margin-bottom:15px; font-weight:600;}
.prog-bar{height:6px; border-radius:6px; background:rgba(0,0,0,.06); overflow:hidden;}
.prog-fill{height:100%; border-radius:6px; background:linear-gradient(90deg, var(--accent), var(--violet-soft)); width:0%; transition:width 1.1s var(--ease);}
.prog-pct{font-size:11.5px; color:var(--text-dim); margin-top:8px; text-align:left; font-weight:700; font-variant-numeric:tabular-nums;}

.empty-state{
  text-align:center; padding:56px 24px; border:1px solid var(--border); background:var(--surface); border-radius:var(--radius-lg); color:var(--text-dim); box-shadow:var(--shadow-sm);
}
.empty-state .empty-title{color:var(--text); font-size:16.5px; font-weight:700; margin-bottom:6px;}
.empty-state .empty-sub{font-size:13.5px; color:var(--text-dim); margin-bottom:22px; max-width:340px; margin-inline:auto; line-height:1.7;}

/* ---------- topic detail ---------- */
.topic-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; gap:14px; flex-wrap:wrap;}
.back-link{display:inline-flex; align-items:center; gap:6px; color:var(--text-dim); font-size:13.5px; font-weight:700; margin-bottom:16px; transition:color .15s ease, transform .15s ease;}
.back-link .icon{width:16px; height:16px;}
.back-link:hover{color:var(--accent); transform:translateX(-2px);}
.topic-title-row{display:flex; align-items:center; gap:14px;}
.topic-title-row .topic-emoji{width:52px; height:52px; font-size:25px;}
.topic-title-row h1{font-size:26px; margin:0; font-weight:800; letter-spacing:-.02em;}
.topic-title-row .sub{color:var(--text-dim); font-size:13.5px; margin-top:3px; font-weight:600;}
.action-row{display:flex; gap:10px; flex-wrap:wrap;}

.cards-list{display:grid; gap:10px; margin-top:20px;}
.card-row{
  display:flex; gap:14px; align-items:flex-start; background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius-md); padding:16px 18px; transition:border-color .2s ease, box-shadow .2s ease;
  box-shadow:var(--shadow-xs);
}
.card-row:hover{border-color:var(--border-strong); box-shadow:var(--shadow-sm);}
.card-row .box-pill{
  flex-shrink:0; font-size:11px; font-weight:700; padding:5px 11px; border-radius:100px; margin-top:2px; letter-spacing:.01em;
}
.card-row .sides{flex:1; display:grid; grid-template-columns:1fr 1fr; gap:16px; min-width:0;}
.card-row .side .k{font-size:10.5px; color:var(--text-dimmer); font-weight:700; margin-bottom:5px; letter-spacing:.5px; text-transform:uppercase;}
.card-row .side .v{font-size:14.5px; color:var(--text); line-height:1.6; overflow-wrap:break-word; font-weight:500;}
.card-row .row-actions{display:flex; gap:6px; flex-shrink:0;}

/* ---------- dashboard ---------- */
.dash-grid{display:grid; grid-template-columns:1.1fr .9fr; gap:18px; align-items:start;}
@media (max-width:860px){.dash-grid{grid-template-columns:1fr;}}
.panel{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:26px; box-shadow:var(--shadow-sm);}
.panel h2{font-family:'Vazirmatn'; font-weight:800;}
.level-ring-wrap{display:flex; align-items:center; gap:26px;}
.level-ring{position:relative; width:132px; height:132px; flex-shrink:0;}
.level-ring svg{transform:rotate(-90deg);}
.level-ring .lvl-num{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
.level-ring .lvl-num .n{font-family:'Inter','Vazirmatn'; font-size:32px; font-weight:800; color:var(--text); letter-spacing:-.02em; font-variant-numeric:tabular-nums;}
.level-ring .lvl-num .l{font-size:10.5px; color:var(--text-dim); font-weight:700; letter-spacing:.02em;}
.xp-info .xp-line{font-size:13.5px; color:var(--text-dim); margin-bottom:9px; font-weight:600;}
.xp-info .xp-line b{color:var(--text); font-weight:800; font-variant-numeric:tabular-nums;}
.mini-bar{width:220px; max-width:100%; height:8px; border-radius:6px; background:rgba(0,0,0,.06); overflow:hidden; margin-top:6px;}
.mini-bar .fill{height:100%; background:linear-gradient(90deg, #ff9f0a, #ff3b30); border-radius:6px; transition:width .9s var(--ease);}

.goal-card{margin-top:18px;}
.goal-ring-row{display:flex; align-items:center; gap:18px;}
.goal-text b{color:var(--success); font-size:19px; font-family:'Inter'; font-weight:800;}

.achv-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(128px,1fr)); gap:10px; margin-top:16px;}
.achv{
  border-radius:var(--radius-sm); padding:16px 10px; text-align:center; background:var(--surface-2); border:1px solid var(--border);
  opacity:.45; filter:grayscale(.7); transition:opacity .35s var(--ease), filter .35s var(--ease), transform .35s var(--ease), box-shadow .35s var(--ease), border-color .35s var(--ease);
  animation:achvIn .5s var(--ease) backwards;
}
@keyframes achvIn{from{opacity:0; transform:translateY(10px);} to{opacity:var(--final-op,1); transform:translateY(0);}}
.achv:hover{transform:translateY(-3px);}
.achv.unlocked{opacity:1; filter:none; border-color:color-mix(in srgb, var(--achv-color) 35%, transparent); background:linear-gradient(160deg,#fff,color-mix(in srgb, var(--achv-color) 6%, #fff)); box-shadow:0 10px 22px -12px color-mix(in srgb, var(--achv-color) 55%, transparent);}
.achv-badge{
  width:40px; height:40px; margin:0 auto 8px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  background:var(--achv-color, var(--accent)); color:#fff; box-shadow:0 4px 10px -3px color-mix(in srgb, var(--achv-color) 60%, transparent);
  transition:transform .3s cubic-bezier(.34,1.56,.64,1);
}
.achv-badge .icon{width:19px; height:19px; stroke-width:1.9;}
.achv.unlocked:hover .achv-badge{transform:scale(1.12) rotate(-6deg);}
.achv .nm{font-size:11.5px; font-weight:800; color:var(--text);}
.achv .ds{font-size:10px; color:var(--text-dim); margin-top:3px; line-height:1.4; font-weight:500;}

.topic-progress-row{display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--border);}
.topic-progress-row:last-child{border-bottom:none;}
.topic-progress-row .nm{width:120px; flex-shrink:0; font-size:13px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.topic-progress-row .bar{flex:1;}

/* ---------- study view ---------- */
.study-shell{min-height:100vh; display:flex; flex-direction:column; align-items:center; background:
  radial-gradient(1000px 560px at 85% -10%, rgba(0,113,227,.05), transparent 60%), var(--bg);}
.study-top{
  width:100%; max-width:640px; display:flex; align-items:center; justify-content:space-between;
  padding:20px 4px 10px; gap:10px; flex-wrap:wrap;
}
.study-top .exit-btn{color:var(--text-dim); font-size:13.5px; font-weight:700; display:flex; align-items:center; gap:6px; padding:8px 6px; border-radius:10px; transition:color .15s ease;}
.study-top .exit-btn .icon{width:16px; height:16px;}
.study-top .exit-btn:hover{color:var(--danger);}
.study-meta{display:flex; align-items:center; gap:10px; font-size:12.5px; color:var(--text-dim); flex-wrap:wrap;}
.study-meta .pill{background:var(--surface); border:1px solid var(--border); padding:7px 13px; border-radius:100px; display:flex; align-items:center; gap:6px; font-weight:700; box-shadow:var(--shadow-xs);}
.study-meta .pill .icon{width:14px; height:14px;}
.study-progbar{width:100%; max-width:640px; height:6px; border-radius:5px; background:rgba(0,0,0,.06); margin:8px 0 30px; overflow:hidden;}
.study-progbar .fill{height:100%; border-radius:5px; background:linear-gradient(90deg, var(--accent), var(--violet-soft)); transition:width .5s var(--ease);}

.stage{width:100%; max-width:560px; display:flex; flex-direction:column; align-items:center; flex:1; padding-bottom:30px; position:relative;}
.flip-scene{width:100%; max-width:520px; height:320px; perspective:1800px; margin-bottom:10px; position:relative;}
.flip-card{width:100%; height:100%; position:relative; transform-style:preserve-3d; transition:transform .6s cubic-bezier(.34,.85,.3,1); cursor:pointer;}
.flip-card.flipped{transform:rotateY(180deg);}
.flip-card.enter{animation:cardSlideIn .42s var(--ease);}
@keyframes cardSlideIn{from{opacity:0; transform:translateX(22px) scale(.97);} to{opacity:1; transform:translateX(0) scale(1);}}
.face{
  position:absolute; inset:0; backface-visibility:hidden; border-radius:26px; padding:36px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
  box-shadow:var(--shadow-card);
}
.face-front{background:var(--card-front); color:var(--text); border:1px solid var(--border);}
.face-back{background:linear-gradient(165deg, var(--card-back-1), var(--card-back-2)); color:#fff; transform:rotateY(180deg);}
.face .tag{position:absolute; top:20px; right:22px; font-size:10.5px; font-weight:800; letter-spacing:.08em; opacity:.4; text-transform:uppercase;}
.face .content{font-size:23px; font-weight:700; line-height:1.65; word-break:break-word; max-height:100%; overflow:auto; letter-spacing:-.01em;}
.face .hint{position:absolute; bottom:18px; font-size:11.5px; opacity:.4; font-weight:600; display:flex; align-items:center; gap:5px;}
.face .hint .icon{width:13px; height:13px;}
.face-back .content{font-weight:500; font-size:19px;}

.controls-row{display:flex; align-items:center; gap:14px; margin:12px 0 22px;}
.ctrl-btn{width:44px; height:44px; border-radius:50%; background:var(--surface); border:1px solid var(--border); color:var(--text-dim); display:flex; align-items:center; justify-content:center; transition:all .2s var(--ease); box-shadow:var(--shadow-xs);}
.ctrl-btn:hover{color:var(--text); background:var(--surface-2); transform:translateY(-2px); box-shadow:var(--shadow-sm);}
.ctrl-btn:active{transform:scale(.9);}

.rate-row{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; width:100%; max-width:520px; opacity:0; pointer-events:none; transition:opacity .3s var(--ease), transform .3s var(--ease); transform:translateY(10px);}
.rate-row.show{opacity:1; pointer-events:auto; transform:translateY(0);}
.rate-btn{
  padding:14px 6px; border-radius:18px; border:1.5px solid; background:var(--surface); font-size:12.5px; font-weight:700;
  display:flex; flex-direction:column; align-items:center; gap:7px; transition:transform .18s var(--ease), background .2s ease, box-shadow .2s ease;
  box-shadow:var(--shadow-xs);
}
.rate-btn .icon{width:20px; height:20px;}
.rate-btn:hover{transform:translateY(-3px); box-shadow:var(--shadow-sm);}
.rate-btn:active{transform:scale(.93);}
.rate-1{border-color:rgba(255,59,48,.28); color:var(--danger);} .rate-1:hover{background:var(--danger-wash);}
.rate-2{border-color:rgba(255,149,0,.3); color:var(--warning);} .rate-2:hover{background:var(--warning-wash);}
.rate-3{border-color:rgba(0,113,227,.28); color:var(--accent);} .rate-3:hover{background:var(--accent-wash);}
.rate-4{border-color:rgba(47,179,80,.3); color:var(--success);} .rate-4:hover{background:var(--success-wash);}

.keyhint{color:var(--text-dimmer); font-size:11.5px; margin-top:8px; text-align:center; font-weight:500;}
.keyhint kbd{background:var(--surface-2); border:1px solid var(--border-strong); border-radius:5px; padding:2px 7px; font-size:10.5px; margin:0 2px; font-weight:700; color:var(--text-dim);}

.session-complete{text-align:center; max-width:440px; margin:60px auto 0; animation:viewIn .55s var(--ease);}
.session-complete .emoji{margin-bottom:6px;}
.session-complete h2{font-size:24px; margin:0 0 6px; font-weight:800;}
.session-complete p{color:var(--text-dim); margin:0 0 28px; font-weight:500;}
.result-stats{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:28px;}
.result-stats .rs{background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:18px 8px; box-shadow:var(--shadow-xs);}
.result-stats .rs .n{font-family:'Inter'; font-size:21px; font-weight:800; color:var(--text); font-variant-numeric:tabular-nums;}
.result-stats .rs .l{font-size:11px; color:var(--text-dim); margin-top:4px; font-weight:600;}

/* ---------- floating xp fly + toasts ---------- */
.xp-fly{
  position:fixed; z-index:200; font-family:'Inter','Vazirmatn'; font-weight:800; font-size:19px; color:var(--warning);
  pointer-events:none; text-shadow:0 2px 10px rgba(255,149,0,.35);
  animation:xpFly 1.05s cubic-bezier(.2,.7,.3,1) forwards;
}
@keyframes xpFly{
  0%{opacity:0; transform:translate(0,0) scale(.6);}
  15%{opacity:1; transform:translate(0,-6px) scale(1.12);}
  70%{opacity:1;}
  100%{opacity:0; transform:translate(var(--tx,0px), var(--ty,-160px)) scale(.75);}
}
.toast-wrap{position:fixed; top:20px; left:50%; transform:translateX(-50%); z-index:300; display:flex; flex-direction:column; gap:8px; align-items:center;}
.toast{
  background:var(--surface); border:1px solid var(--border-strong); color:var(--text); padding:12px 22px; border-radius:100px;
  font-size:13.5px; font-weight:700; box-shadow:var(--shadow-lg); display:flex; align-items:center; gap:8px;
  animation:toastIn .4s var(--ease), toastOut .4s ease 2.6s forwards;
}
@keyframes toastIn{from{opacity:0; transform:translateY(-14px) scale(.92);} to{opacity:1; transform:translateY(0) scale(1);}}
@keyframes toastOut{to{opacity:0; transform:translateY(-12px) scale(.94);}}

.levelup-overlay{
  position:fixed; inset:0; z-index:400; display:flex; align-items:center; justify-content:center;
  background:rgba(20,20,22,.42); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); opacity:0; pointer-events:none; transition:opacity .35s ease;
}
.levelup-overlay.show{opacity:1; pointer-events:auto;}
.levelup-card{
  text-align:center; padding:46px 54px; border-radius:30px;
  background:var(--surface);
  box-shadow:0 40px 90px -20px rgba(0,0,0,.35), 0 0 0 1px rgba(0,0,0,.04);
  transform:scale(.7); opacity:0; transition:transform .5s cubic-bezier(.34,1.56,.64,1), opacity .4s ease;
}
.levelup-overlay.show .levelup-card{transform:scale(1); opacity:1;}
.levelup-card h2{font-size:16px; color:var(--text-dim); margin:12px 0 2px; font-weight:700;}
.levelup-card .lvl{font-family:'Inter'; font-size:60px; font-weight:800; color:var(--text); margin:0; letter-spacing:-.03em;}

.confetti-piece{position:fixed; top:-10px; z-index:350; border-radius:2px; pointer-events:none; animation:confettiFall linear forwards;}
@keyframes confettiFall{
  to{ transform:translateY(105vh) rotate(var(--rot,540deg)); opacity:.2; }
}

/* ---------- modal ---------- */
.modal-backdrop{position:fixed; inset:0; background:rgba(20,20,22,.4); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); z-index:150; display:flex; align-items:center; justify-content:center; padding:20px; opacity:0; animation:fadeModal .2s ease forwards;}
@keyframes fadeModal{to{opacity:1;}}
.modal-box{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:28px; width:100%; max-width:440px;
  box-shadow:var(--shadow-lg); transform:translateY(14px) scale(.97); animation:modalIn .32s var(--ease) forwards;
}
@keyframes modalIn{to{transform:translateY(0) scale(1);}}
.modal-box h3{margin:0 0 20px; font-size:19px; font-weight:800;}
.modal-actions{display:flex; gap:10px; justify-content:flex-end; margin-top:8px;}
.emoji-picker{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;}
.emoji-opt{width:40px; height:40px; border-radius:12px; background:var(--surface-2); border:1.5px solid var(--border-strong); display:flex; align-items:center; justify-content:center; font-size:18px; transition:all .16s var(--ease);}
.emoji-opt:hover{border-color:var(--accent-soft);}
.emoji-opt.sel{border-color:var(--accent); background:var(--accent-wash); transform:scale(1.08);}

.loading-screen{min-height:100vh; display:flex; align-items:center; justify-content:center; color:var(--text-dim); font-size:14.5px; gap:10px; background:var(--bg); font-weight:600;}
.spin{width:18px; height:18px; border-radius:50%; border:2.5px solid var(--border-strong); border-top-color:var(--accent); animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ---------- illustrations (soft animated blobs for empty/celebration states) ---------- */
.illus{position:relative; width:96px; height:96px; margin:0 auto 20px; display:flex; align-items:center; justify-content:center;}
.illus-blob{position:absolute; inset:0; border-radius:38% 62% 63% 37% / 41% 38% 62% 59%; background:linear-gradient(140deg, var(--c1), var(--c2)); opacity:.16; animation:blobMove 7s ease-in-out infinite;}
@keyframes blobMove{0%,100%{border-radius:38% 62% 63% 37% / 41% 38% 62% 59%; transform:rotate(0deg) scale(1);} 50%{border-radius:58% 42% 38% 62% / 55% 58% 42% 45%; transform:rotate(8deg) scale(1.04);}}
.illus-icon{position:relative; z-index:1; width:42px; height:42px; color:var(--c1);}
.illus-icon .icon{width:100%; height:100%; stroke-width:1.4;}

/* ---------- micro-interactions ---------- */
.toast-ic{display:flex; flex-shrink:0;}
.toast-ic .icon{width:16px; height:16px;}
.btn:hover .icon, .btn-icon:hover .icon, .ctrl-btn:hover .icon{transform:scale(1.12);}
.ctrl-btn[onclick*="shuffleQueue"]:hover .icon{transform:rotate(90deg);}
.topic-menu-btn{transition:background .2s ease, color .2s ease, transform .2s ease;}
.topic-menu-btn:hover .icon{transform:rotate(90deg);}
.topic-menu-btn .icon{transition:transform .25s var(--ease);}
.streak-chip .icon{animation:flamePulse 2.4s ease-in-out infinite;}
@keyframes flamePulse{0%,100%{transform:scale(1); opacity:1;} 50%{transform:scale(1.14); opacity:.85;}}
.prog-fill{position:relative; overflow:hidden;}
.prog-fill::after{
  content:''; position:absolute; inset:0;
  background:linear-gradient(100deg, transparent 30%, rgba(255,255,255,.55) 50%, transparent 70%);
  background-size:200% 100%; animation:shimmer 2.6s ease-in-out infinite;
}
@keyframes shimmer{0%{background-position:180% 0;} 100%{background-position:-20% 0;}}
.back-link .icon{transition:transform .2s var(--ease);}
.back-link:hover .icon{transform:translateX(3px);}
.brand-mark{transition:transform .3s cubic-bezier(.34,1.56,.64,1);}
.brand:hover .brand-mark{transform:rotate(-8deg) scale(1.08);}
.topic-emoji{transition:transform .3s cubic-bezier(.34,1.56,.64,1);}
.topic-card:hover .topic-emoji{transform:scale(1.08) rotate(-4deg);}
.card-row{animation:rowIn .45s var(--ease) backwards;}
@keyframes rowIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
.topic-card{animation:cardIn .5s var(--ease) backwards;}
@keyframes cardIn{from{opacity:0; transform:translateY(14px) scale(.97);} to{opacity:1; transform:translateY(0) scale(1);}}
.stat-card{animation:cardIn .5s var(--ease) backwards;}
.rate-btn .icon{transition:transform .2s cubic-bezier(.34,1.56,.64,1);}
.rate-btn:hover .icon{transform:scale(1.18);}
.emoji-opt .icon{width:18px; height:18px; transition:transform .2s var(--ease);}
.emoji-opt:hover .icon{transform:scale(1.15);}
.level-ring svg circle:last-child, .goal-ring-row svg circle:last-child{filter:drop-shadow(0 0 6px rgba(0,0,0,.08));}
.exit-btn .icon{transition:transform .2s var(--ease);}
.exit-btn:hover .icon{transform:rotate(90deg);}


  .stat-strip{grid-template-columns:repeat(2,1fr);}
  .card-row .sides{grid-template-columns:1fr;}
  .hero h1{font-size:27px;}
  .flip-scene{height:270px;}
  .level-ring-wrap{flex-direction:column; text-align:center;}
  .dash-grid{gap:16px;}
  .main{padding:24px 16px 80px;}
  .topbar{padding:12px 16px;}
}
</style>
</head>
<body>

<div id="loading" class="loading-screen"><div class="spin"></div> در حال بارگذاری…</div>

<div class="app" id="app" style="display:none;">
  <header class="topbar" id="topbar">
    <div class="brand" onclick="go('home')"><span class="brand-mark"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l1.8 5.6L19 9l-5.2 1.4L12 16l-1.8-5.6L5 9l5.2-1.4Z"/></svg></span> فلش‌کوئست</div>
    <div class="nav-links">
      <button class="nav-btn" data-nav="home" onclick="go('home')"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg> خانه</button>
      <button class="nav-btn" data-nav="dashboard" onclick="go('dashboard')"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V10"/><path d="M10 19V5"/><path d="M16 19v-7"/><path d="M4 19h16"/></svg> داشبورد</button>
    </div>
    <div class="streak-chip"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2c1.2 3.6-3 5-3 8.5a3 3 0 0 0 6 0c0-.8-.3-1.5-.7-1.9.7 2.3-.7 3-.7 3 .3-1.5-.7-2.3-.7-3.1 0-1.6.8-2.3-.9-6.5Z"/></svg> <span id="topbarStreak">0</span> روز</div>
  </header>

  <main class="main">
    <section class="view" id="view-home"></section>
    <section class="view" id="view-topic"></section>
    <section class="view" id="view-dashboard"></section>
  </main>
</div>

<section class="view" id="view-study" style="min-height:100vh;"></section>

<div class="toast-wrap" id="toastWrap"></div>
<div class="levelup-overlay" id="levelupOverlay">
  <div class="levelup-card">
    <div class="illus" style="--c1:#ff9500; --c2:#ff3b30;"><div class="illus-blob"></div><div class="illus-icon"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l1.8 5.6L19 9l-5.2 1.4L12 16l-1.8-5.6L5 9l5.2-1.4Z"/><path d="M19 15l.7 2.1L22 18l-2.3.9L19 21l-.7-2.1L16 18l2.3-.9Z"/><path d="M4 15l.6 1.8L6 17l-1.4.5L4 19l-.6-1.5L2 17l1.4-.2Z"/></svg></div></div>
    <h2>سطح‌ات بالا رفت!</h2>
    <p class="lvl" id="levelupNum">5</p>
  </div>
</div>

<script>
/* ============================= ICONS ============================= */
const ICON_PATHS = {
  edit: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
  trash: '<path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/>',
  play: '<path d="M7 4.2v15.6a1 1 0 0 0 1.5.87l13-7.8a1 1 0 0 0 0-1.74l-13-7.8A1 1 0 0 0 7 4.2Z"/>',
  chevronLeft: '<path d="M15 18l-6-6 6-6"/>',
  chevronRight: '<path d="M9 18l6-6-6-6"/>',

  close: '<path d="M18 6 6 18M6 6l12 12"/>',
  more: '<circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/>',
  xCircle: '<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5l5 5M14.5 9.5l-5 5"/>',

  checkCircle: '<circle cx="12" cy="12" r="9"/><path d="M8 12.3l2.6 2.6L16 9.5"/>',
  sparkle: '<path d="M12 3l1.9 5.6L19.5 10l-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.9Z"/>',

  book: '<path d="M4 5.2A2.2 2.2 0 0 1 6.2 3H20v16.5H6.2A2.2 2.2 0 0 0 4 21.5Z"/><path d="M4 5.2v16.3"/>',
  /* subject icons */
  flask: '<path d="M9 2h6"/><path d="M10 2v6.5L4.5 19a2 2 0 0 0 1.8 3h11.4a2 2 0 0 0 1.8-3L14 8.5V2"/><path d="M7.5 15h9"/>',
  globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.5 2.5 3.5 6 3.5 9s-1 6.5-3.5 9c-2.5-2.5-3.5-6-3.5-9s1-6.5 3.5-9Z"/>',
  palette: '<path d="M12 2a10 10 0 1 0 0 20c1.4 0 2-1 2-2 0-.6-.3-1-.6-1.4-.3-.4-.4-.8-.1-1.2.3-.4.9-.5 1.4-.5H17a4 4 0 0 0 4-4c0-6-4.5-11-9-11Z"/><circle cx="7.5" cy="10.5" r="1.1"/><circle cx="12" cy="7" r="1.1"/><circle cx="16" cy="9.5" r="1.1"/>',
  music: '<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>',
  code: '<path d="M8 5 2 12l6 7"/><path d="M16 5l6 7-6 7"/>',
  brain: '<path d="M9 3a3 3 0 0 0-3 3v.3A3 3 0 0 0 4 9v1a3 3 0 0 0 1 2.2A3 3 0 0 0 4 15v1a3 3 0 0 0 3 3h1"/><path d="M15 3a3 3 0 0 1 3 3v.3A3 3 0 0 1 20 9v1a3 3 0 0 1-1 2.2A3 3 0 0 1 20 15v1a3 3 0 0 1-3 3h-1"/><path d="M9 3v18M15 3v18"/>',
  chat: '<path d="M21 11.5a8.4 8.4 0 0 1-8.9 8.4 8.6 8.6 0 0 1-3.8-.9L3 21l1.9-5.1A8.3 8.3 0 0 1 4 11.5 8.4 8.4 0 0 1 12.5 3 8.4 8.4 0 0 1 21 11.5Z"/>',
  ruler: '<path d="M3 17 17 3l4 4L7 21Z"/><path d="M8 12l2 2M11 9l2 2M14 6l2 2"/>',
  landmark: '<path d="M3 21h18"/><path d="M4 21V10M9 21V10M15 21V10M20 21V10"/><path d="M2 10 12 4l10 6Z"/>',
  atom: '<circle cx="12" cy="12" r="1.3"/><ellipse cx="12" cy="12" rx="9" ry="3.5"/><ellipse cx="12" cy="12" rx="9" ry="3.5" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="9" ry="3.5" transform="rotate(120 12 12)"/>',
  dna: '<path d="M6 3c0 5 12 5 12 10s-12 5-12 10"/><path d="M18 3c0 5-12 5-12 10s12 5 12 10"/><path d="M7.5 7h9M7.5 17h9"/>',
  network: '<circle cx="5" cy="6" r="2"/><circle cx="19" cy="6" r="2"/><circle cx="12" cy="18" r="2"/><path d="M6.7 7.2 11 16M17.3 7.2 13 16M7 6h10"/>',
  leaf: '<path d="M20 4C10 4 4 10 4 20c10 0 16-6 16-16Z"/><path d="M4 20 14 10"/>',
  bolt: '<path d="M13 2 4 14h6l-1 8 9-12h-6Z"/>',

  target: '<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.3"/>',
  layers: '<path d="M12 3 3 8l9 5 9-5Z"/><path d="M3 13l9 5 9-5"/>',
  trophy: '<path d="M8 4h8v4a4 4 0 0 1-8 0Z"/><path d="M6 4H4a2 2 0 0 0 2 4"/><path d="M18 4h2a2 2 0 0 1-2 4"/><path d="M9 15h6l1 5H8Z"/><path d="M12 12v3"/>',
  flame: '<path d="M12 2c1.2 3.6-3 5-3 8.5a3 3 0 0 0 6 0c0-.8-.3-1.5-.7-1.9.7 2.3-.7 3-.7 3 .3-1.5-.7-2.3-.7-3.1 0-1.6.8-2.3-.9-6.5Z"/>',
  rocket: '<path d="M14.5 2.5c2 2 3 5 2 9-1 1-3 2-4.5 2s-3.5-1-4.5-2c-1-4 0-7 2-9 1.5-1.2 3.5-1.2 5 0Z"/><path d="M9 15c-2 .5-3 2-3 5 3 0 4.5-1 5-3"/><path d="M15 15c2 .5 3 2 3 5-3 0-4.5-1-5-3"/><circle cx="12" cy="9" r="1.3"/>',
  crown: '<path d="M4 18h16l1-9-5 3-4-6-4 6-5-3Z"/>',
  library: '<path d="M4 5.2A2.2 2.2 0 0 1 6.2 3H20v16.5H6.2A2.2 2.2 0 0 0 4 21.5Z"/><path d="M4 5.2v16.3"/><path d="M9 8h7M9 11.5h7"/>',
  checkBadge: '<path d="M12 2l2.4 1.6 2.8-.3 1 2.6 2.6 1-.3 2.8L22 12l-1.6 2.4.3 2.8-2.6 1-1 2.6-2.8-.3L12 22l-2.4-1.6-2.8.3-1-2.6-2.6-1 .3-2.8L2 12l1.6-2.4-.3-2.8 2.6-1 1-2.6 2.8.3Z"/><path d="M8.5 12.3l2.5 2.5 4.5-5"/>',
  medal: '<circle cx="12" cy="15" r="6"/><path d="M9 9.5 6 3M15 9.5 18 3"/><path d="M9.5 15.5 12 17l2.5-1.5"/>',
  gem: '<path d="M6 3h12l3 5-9 13L3 8Z"/><path d="M3 8h18"/><path d="M9 3l3 5 3-5"/><path d="M12 8v13"/>',
};
function icon(name, extraClass){
  if(!ICON_PATHS[name]) return '';
  return `<svg class="icon${extraClass?(' '+extraClass):''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON_PATHS[name]}</svg>`;
}
/* renders a topic's chosen icon, gracefully falling back to raw text for legacy emoji data */
function topicIcon(key){ return ICON_PATHS[key] ? icon(key) : escapeHtml(key||''); }
/* soft animated blob illustration used for empty states / celebration moments */
function illustration(iconKey, c1, c2){
  return `<div class="illus" style="--c1:${c1}; --c2:${c2};"><div class="illus-blob"></div><div class="illus-icon">${icon(iconKey)}</div></div>`;
}

/* ============================= STATE ============================= */
const STORAGE_KEY = 'flashquest-state-v1';
const RATE = { NOT_KNOWN:1, HARD:2, KNOW:3, PERFECT:4 };
const RATE_XP = {1:5, 2:8, 3:12, 4:16};
const TOPIC_ICONS = ['book','flask','globe','palette','music','code','brain','chat','ruler','landmark','atom','dna','network','leaf','bolt'];

const ACHIEVEMENTS = [
  {id:'first_card', name:'اولین قدم', desc:'اولین کارت را مطالعه کن', icon:'target', color:'#0071e3', check:s=>s.stats.totalCardsStudied>=1},
  {id:'ten_cards', name:'ده‌تایی', desc:'۱۰ کارت مطالعه کن', icon:'layers', color:'#6e5de7', check:s=>s.stats.totalCardsStudied>=10},
  {id:'fifty_cards', name:'پرتلاش', desc:'۵۰ کارت مطالعه کن', icon:'layers', color:'#0071e3', check:s=>s.stats.totalCardsStudied>=50},
  {id:'hundred_cards', name:'صدتایی', desc:'۱۰۰ کارت مطالعه کن', icon:'trophy', color:'#ff9500', check:s=>s.stats.totalCardsStudied>=100},
  {id:'five_hundred_cards', name:'افسانه', desc:'۵۰۰ کارت مطالعه کن', icon:'trophy', color:'#ff3b30', check:s=>s.stats.totalCardsStudied>=500},
  {id:'streak_3', name:'سه‌روزه', desc:'۳ روز پشت‌سرهم', icon:'flame', color:'#ff9500', check:s=>s.stats.streak>=3},
  {id:'streak_7', name:'هفته طلایی', desc:'۷ روز پشت‌سرهم', icon:'flame', color:'#ff3b30', check:s=>s.stats.streak>=7},
  {id:'streak_14', name:'دوهفته‌ای', desc:'۱۴ روز پشت‌سرهم', icon:'flame', color:'#6e5de7', check:s=>s.stats.streak>=14},
  {id:'streak_30', name:'ماراتن‌کار', desc:'۳۰ روز پشت‌سرهم', icon:'crown', color:'#ff3b30', check:s=>s.stats.streak>=30},
  {id:'level_5', name:'سطح ۵', desc:'به سطح ۵ برس', icon:'rocket', color:'#0071e3', check:s=>levelInfo(s.stats.xp).level>=5},

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function todayStr(){ return new Date().toISOString().slice(0,10); }

function defaultState(){
  return {
    topics: [],
    stats: { xp:0, streak:0, lastStudyDate:null, cardsStudiedToday:0, dailyGoal:20, totalCardsStudied:0, achievements:[] }
  };
}

let state = null;
let saveTimer = null;
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveData, 300);
}
async function saveData(){
  try{ await window.storage.set(STORAGE_KEY, JSON.stringify(state), false); }
  catch(e){ console.error('ذخیره‌سازی ناموفق بود', e); }
}
async function loadData(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value) return JSON.parse(res.value);
  }catch(e){ console.warn('داده ذخیره‌شده‌ای پیدا نشد', e); }
  return defaultState();
}

/* ============================= LEVEL / XP MATH ============================= */
function xpNeededFor(level){ return 100 + (level-1)*22; }
function levelInfo(totalXp){
  let level=1, remain=totalXp, need=xpNeededFor(1);
  while(remain>=need){ remain-=need; level++; need=xpNeededFor(level); }
  return { level, currentXp:remain, neededXp:need };
}

/* ============================= TOPIC / CARD HELPERS ============================= */
function getTopic(id){ return state.topics.find(t=>t.id===id); }
function topicMastery(t){
  if(!t.cards.length) return 0;
  const sum = t.cards.reduce((a,c)=>a+c.box,0);
  return Math.round((sum/(t.cards.length*4))*100);
}

function addXp(amount){
  const before = levelInfo(state.stats.xp).level;
  state.stats.xp += amount;
  const after = levelInfo(state.stats.xp).level;
  return after>before ? after : null;
}

function registerStudyTick(){
  const today = todayStr();
  if(state.stats.lastStudyDate !== today){
    const y = new Date(); y.setDate(y.getDate()-1);
    const yesterday = y.toISOString().slice(0,10);
    state.stats.streak = (state.stats.lastStudyDate===yesterday) ? state.stats.streak+1 : 1;
    state.stats.lastStudyDate = today;
    state.stats.cardsStudiedToday = 0;
  }
  state.stats.cardsStudiedToday++;
  state.stats.totalCardsStudied++;
}

function checkAchievements(){
  const unlocked = [];
  ACHIEVEMENTS.forEach(a=>{
    if(!state.stats.achievements.includes(a.id) && a.check(state)){
      state.stats.achievements.push(a.id);
      unlocked.push(a);
    }
  });
  return unlocked;
}

function parseHash(){
  const h = location.hash.replace('#','') || 'home';
  const parts = h.split('/');
  return { view:parts[0], id:parts[1] };
}

function render(){
  const { view, id } = parseHash();
  document.getElementById('app').style.display = view==='study' ? 'none' : '';
  document.getElementById('view-study').style.display = view==='study' ? '' : 'none';
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active', b.dataset.nav===view));
  document.getElementById('topbarStreak').textContent = state.stats.streak;

  if(view==='home'){ document.getElementById('view-home').classList.add('active'); renderHome(); }
  else if(view==='topic' && id){ document.getElementById('view-topic').classList.add('active'); renderTopic(id); }
  else if(view==='dashboard'){ document.getElementById('view-dashboard').classList.add('active'); renderDashboard(); }

}

/* ============================= STUDY VIEW ============================= */
function buildQueue(topic){
  const ids = topic.cards.map(c=>c.id);
  for(let i=ids.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [ids[i],ids[j]]=[ids[j],ids[i]]; }
  return ids;
}

function startStudy(topicId){
  const t = getTopic(topicId);
  if(!t || t.cards.length===0){ go('topic/'+topicId); return; }
  currentStudy = {
    topicId, total: t.cards.length,
    queue: buildQueue(t), idx:0, flipped:false,
    sessionStudied:0, sessionXp:0,
  };
  renderStudyCard(true);
}

function currentCard(){
  const t = getTopic(currentStudy.topicId);
  const cardId = currentStudy.queue[currentStudy.idx];
  return t.cards.find(c=>c.id===cardId);
}

function renderStudyCard(fresh){
  const el = document.getElementById('view-study');
  if(currentStudy.idx >= currentStudy.queue.length){ renderSessionComplete(); return; }
  const t = getTopic(currentStudy.topicId);
  const c = currentCard();
  const progressPct = Math.round((currentStudy.idx/currentStudy.queue.length)*100);
  const li = levelInfo(state.stats.xp);

  el.innerHTML = `
    <div class="study-shell">
      <div class="study-top">
        <a class="exit-btn" onclick="exitStudy()">${icon('close')} خروج</a>
        <div class="study-meta">
          <span class="pill">${topicIcon(t.emoji)} ${escapeHtml(t.name)}</span>
          <span class="pill">${icon('sparkle')} سطح ${li.level}</span>
          <span class="pill"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2c1.2 3.6-3 5-3 8.5a3 3 0 0 0 6 0c0-.8-.3-1.5-.7-1.9.7 2.3-.7 3-.7 3 .3-1.5-.7-2.3-.7-3.1 0-1.6.8-2.3-.9-6.5Z"/></svg> ${state.stats.streak} روز</span>
        </div>
      </div>
      <div class="study-progbar"><div class="fill" style="width:${progressPct}%"></div></div>

      <div class="stage">
        <div class="flip-scene">
          <div class="flip-card ${fresh?'enter':''}" id="flipCard" onclick="toggleFlip()">
            <div class="face face-front">
              <span class="tag">جلو</span>
              <div class="content">${escapeHtml(c.front)}</div>
              <span class="hint">برای دیدن جواب کلیک کن یا Space بزن</span>
            </div>
            <div class="face face-back">
              <span class="tag">پشت</span>
              <div class="content">${escapeHtml(c.back)}</div>
            </div>
          </div>
        </div>

        <div class="controls-row">
          <button class="ctrl-btn" onclick="prevCard()" title="قبلی">${icon('chevronRight')}</button>
          <button class="ctrl-btn" onclick="shuffleQueue()" title="بُر زدن">${icon('shuffle')}</button>
          <button class="ctrl-btn" onclick="nextCard()" title="بعدی">${icon('chevronLeft')}</button>
        </div>

        <div class="rate-row" id="rateRow">
          <button class="rate-btn rate-1" onclick="rateCard(1)">${icon('xCircle')}بلد نبودم</button>
          <button class="rate-btn rate-2" onclick="rateCard(2)">${icon('alertTriangle')}سخت بود</button>
          <button class="rate-btn rate-3" onclick="rateCard(3)">${icon('checkCircle')}بلد بودم</button>
          <button class="rate-btn rate-4" onclick="rateCard(4)">${icon('sparkle')}خیلی خوب بلد بودم</button>
        </div>
        <div class="keyhint">
          فلیپ: <kbd>Space</kbd> &nbsp; حرکت: <kbd>←</kbd> <kbd>→</kbd> &nbsp; امتیاز: <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> <kbd>4</kbd>
        </div>
      </div>
    </div>
  `;
  currentStudy.flipped = false;
}

function toggleFlip(){
  const cardEl = document.getElementById('flipCard');
  currentStudy.flipped = !currentStudy.flipped;
  cardEl.classList.toggle('flipped', currentStudy.flipped);
  document.getElementById('rateRow').classList.toggle('show', currentStudy.flipped);
}

function nextCard(){
  if(currentStudy.idx < currentStudy.queue.length-1){ currentStudy.idx++; renderStudyCard(true); }
}
function prevCard(){
  if(currentStudy.idx > 0){ currentStudy.idx--; renderStudyCard(true); }
}
function shuffleQueue(){
  const rest = currentStudy.queue.slice(currentStudy.idx+1);
  for(let i=rest.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [rest[i],rest[j]]=[rest[j],rest[i]]; }
  currentStudy.queue = currentStudy.queue.slice(0,currentStudy.idx+1).concat(rest);
  showToast('کارت‌ها بُر خوردند', 'shuffle');
}

function rateCard(rating){
  const t = getTopic(currentStudy.topicId);
  const c = currentCard();
  c.reviews = (c.reviews||0)+1;

  if(rating===RATE.NOT_KNOWN) c.box = 0;
  else if(rating===RATE.HARD) c.box = Math.max(0, c.box-1);
  else if(rating===RATE.KNOW) c.box = Math.min(4, c.box+1);
  else c.box = Math.min(4, c.box+2);

  // reinsert into queue based on rating (spaced repetition within session)
  const q = currentStudy.queue;
  if(rating===RATE.NOT_KNOWN){
    const pos = Math.min(q.length, currentStudy.idx + 2 + Math.floor(Math.random()*2));
    q.splice(pos, 0, c.id);
  } else if(rating===RATE.HARD){
    const pos = Math.min(q.length, currentStudy.idx + 5 + Math.floor(Math.random()*3));
    q.splice(pos, 0, c.id);
  }
  // KNOW / PERFECT: not reinserted this session

  registerStudyTick();
  const xp = RATE_XP[rating];
  const leveledUp = addXp(xp);
  currentStudy.sessionStudied++;
  currentStudy.sessionXp += xp;

  flyXp(xp);
  const unlocked = checkAchievements();
  scheduleSave();

  setTimeout(()=>{
    currentStudy.idx++;
    renderStudyCard(true);
    unlocked.forEach(a=>showToast('دستاورد جدید: '+a.name, a.icon, a.color));
    if(unlocked.length) burstConfetti();
    if(leveledUp) showLevelUp(leveledUp);
    updateTopbarStreak();
  }, 280);
}

function updateTopbarStreak(){
  document.getElementById('topbarStreak').textContent = state.stats.streak;
}

function exitStudy(){
  currentStudy = null;
  go('topic/'+parseHash().id);
}

function renderSessionComplete(){
  const el = document.getElementById('view-study');
  const t = getTopic(currentStudy.topicId);
  el.innerHTML = `
    <div class="study-shell">
      <div class="study-top"><a class="exit-btn" onclick="exitStudy()">${icon('close')} خروج</a></div>
      <div class="session-complete">
        <div class="emoji">${illustration('checkCircle','#2fb350','#0071e3')}</div>
        <h2>مرور تموم شد!</h2>
        <p>عالی بود، همینطور ادامه بده.</p>
        <div class="result-stats">
          <div class="rs"><div class="n">${currentStudy.sessionStudied}</div><div class="l">کارت مرور شد</div></div>
          <div class="rs"><div class="n">+${currentStudy.sessionXp}</div><div class="l">XP گرفتی</div></div>
          <div class="rs"><div class="n">${topicMastery(t)}%</div><div class="l">تسلط فعلی</div></div>
        </div>
        <div class="action-row" style="justify-content:center;">
          <button class="btn btn-ghost" onclick="go('topic/${t.id}')">بازگشت به موضوع</button>
          <button class="btn btn-primary" onclick="go('study/${t.id}')">مرور دوباره</button>
        </div>
      </div>
    </div>
  `;
  burstConfetti(true);
}

/* keyboard controls for study view */
document.addEventListener('keydown', (e)=>{
  if(parseHash().view!=='study' || !currentStudy) return;
  if(e.code==='Space'){ e.preventDefault(); toggleFlip(); }
  else if(e.code==='ArrowRight'){ prevCard(); }
  else if(e.code==='ArrowLeft'){ nextCard(); }
  else if(currentStudy.flipped && ['1','2','3','4'].includes(e.key)){ rateCard(Number(e.key)); }
});

/* ============================= FX: xp fly / toast / confetti / levelup ============================= */
function flyXp(amount){
  const cardEl = document.getElementById('flipCard');
  if(!cardEl) return;
  const rect = cardEl.getBoundingClientRect();
  const el = document.createElement('div');
  el.className = 'xp-fly';
  el.textContent = '+' + amount + ' XP';
  el.style.left = (rect.left + rect.width/2 - 30) + 'px';
  el.style.top = (rect.top + rect.height/2) + 'px';
  el.style.setProperty('--tx', (window.innerWidth/2 - rect.left - rect.width/2) + 'px');
  el.style.setProperty('--ty', (-rect.top + 10) + 'px');
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 1100);
}

function showToast(msg, iconKey, iconColor){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast';
  const iconHtml = iconKey ? `<span class="toast-ic" style="color:${iconColor||'var(--accent)'}">${icon(iconKey)}</span>` : '';
  el.innerHTML = iconHtml + `<span>${escapeHtml(msg)}</span>`;
  wrap.appendChild(el);
  setTimeout(()=>el.remove(), 3100);
}

function showLevelUp(level){
  const overlay = document.getElementById('levelupOverlay');
  document.getElementById('levelupNum').textContent = level;
  overlay.classList.add('show');
  burstConfetti();
  setTimeout(()=>overlay.classList.remove('show'), 2200);
}

function burstConfetti(big){
  const colors = ['#e8a33d','#f2c777','#37b7a3','#4caf80','#4fb0d6','#faf6ec'];
  const count = big ? 70 : 40;
  for(let i=0;i<count;i++){
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    const size = 6+Math.random()*7;
    el.style.width = size+'px';
    el.style.height = (size*1.6)+'px';
    el.style.left = (Math.random()*100)+'vw';
    el.style.background = colors[Math.floor(Math.random()*colors.length)];
    el.style.setProperty('--rot', (Math.random()>0.5?1:-1)*(360+Math.random()*540)+'deg');
    el.style.animationDuration = (2.2+Math.random()*1.6)+'s';
    el.style.animationDelay = (Math.random()*0.3)+'s';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 4200);
  }
}

/* ============================= MODAL ============================= */
function openModal(innerHtml){
  closeModal();
  const bd = document.createElement('div');
  bd.className = 'modal-backdrop';
  bd.id = 'activeModal';
  bd.onclick = (e)=>{ if(e.target===bd) closeModal(); };
  bd.innerHTML = `<div class="modal-box" onclick="event.stopPropagation()">${innerHtml}</div>`;
  document.body.appendChild(bd);
}
function closeModal(){ document.getElementById('activeModal')?.remove(); }
function shake(inputId){
  const el = document.getElementById(inputId);
  if(!el) return;
  el.style.borderColor = 'var(--danger)';
  el.animate([{transform:'translateX(0)'},{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(0)'}], {duration:280});
  el.focus();
}

/* ============================= UTIL ============================= */
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ============================= BOOT ============================= */
(async function boot(){
  state = await loadData();
  if(!state.stats.achievements) state.stats.achievements = [];
  document.getElementById('loading').style.display = 'none';
  document.getElementById('app').style.display = '';
  render();
})();
</script>
</body>
