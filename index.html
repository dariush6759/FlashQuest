<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>فلش‌کوئست</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f5f7;
  --bg-secondary:#ffffff;
  --surface:#ffffff;
  --surface-secondary:#fbfbfd;
  --border:rgba(0,0,0,.08);
  --border-strong:rgba(0,0,0,.12);
  --text:#1d1d1f;
  --text-secondary:#6e6e73;
  --text-tertiary:#a1a1a6;
  --divider:rgba(0,0,0,.06);

  --accent:#0071e3;
  --accent-light:#3d94f0;
  --accent-wash:rgba(0,113,227,.1);
  --success:#2fb350;
  --success-wash:rgba(47,179,80,.12);
  --warning:#ff9500;
  --warning-wash:rgba(255,149,0,.12);
  --danger:#ff3b30;
  --danger-wash:rgba(255,59,48,.12);
  --violet:#6e5de7;
  --violet-wash:rgba(110,93,231,.12);

  --shadow-xs: 0 1px 3px rgba(0,0,0,.05);
  --shadow-sm: 0 2px 8px rgba(0,0,0,.06);
  --shadow-md: 0 12px 32px rgba(0,0,0,.12);
  --shadow-lg: 0 24px 64px rgba(0,0,0,.18);
  
  --radius-xs: 8px;
  --radius-sm: 12px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --radius-xl: 32px;

  --ease: cubic-bezier(.2,.8,.2,1);
  --ease-out: cubic-bezier(.2,.8,.3,1);
  --ease-bounce: cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-font-smoothing:antialiased;}
html,body{margin:0;padding:0;}
body{
  background:radial-gradient(1400px 700px at 80% -5%, rgba(0,113,227,.05), transparent 60%),
             radial-gradient(1000px 600px at -5% 110%, rgba(110,93,231,.05), transparent 60%),
             var(--bg);
  color:var(--text);
  font-family:'Vazirmatn','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  min-height:100vh;
  overflow-x:hidden;
  font-size:16px;
  line-height:1.5;
  -webkit-user-select:none;
  user-select:none;
}
::selection{background:rgba(0,113,227,.2);}
h1,h2,h3{font-weight:800; letter-spacing:-.02em;}
button{font-family:inherit; cursor:pointer; border:none;}
a{color:inherit; text-decoration:none;}
::-webkit-scrollbar{width:10px;}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,.15); border-radius:6px; border:3px solid var(--bg);}
::-webkit-scrollbar-track{background:transparent;}

.app{min-height:100vh; display:flex; flex-direction:column;}
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:12px 24px; position:sticky; top:0; z-index:40;
  background:rgba(245,245,247,.72);
  backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--divider);
}
.brand{display:flex; align-items:center; gap:10px; font-size:18px; font-weight:900; letter-spacing:-.015em; cursor:pointer; transition:all .3s var(--ease);}
.brand:hover{transform:scale(.98);}
.brand-icon{width:32px; height:32px; border-radius:10px; background:linear-gradient(140deg, #0071e3, #6e5de7); display:flex; align-items:center; justify-content:center; color:#fff; font-size:16px; font-weight:700; box-shadow:0 4px 12px rgba(0,113,227,.4);}
.topbar-nav{display:flex; gap:6px; background:rgba(0,0,0,.05); padding:6px; border-radius:100px;}
.nav-btn{padding:8px 14px; border-radius:100px; background:transparent; color:var(--text-secondary); font-size:13px; font-weight:700; transition:all .25s var(--ease); border:none;}
.nav-btn:hover{color:var(--text); background:rgba(0,0,0,.04);}
.nav-btn.active{color:var(--text); background:var(--surface); box-shadow:var(--shadow-xs);}
.streak{display:flex; align-items:center; gap:7px; padding:8px 14px; border-radius:100px; background:var(--warning-wash); border:1px solid rgba(255,149,0,.2); font-size:13px; font-weight:700; color:#c96e00;}

.main{flex:1; padding:32px 24px 100px; max-width:1200px; margin:0 auto; width:100%;}
.view{display:none; opacity:0; transform:translateY(12px);}
.view.active{display:block; animation:viewIn .4s var(--ease) forwards;}
@keyframes viewIn{to{opacity:1; transform:translateY(0);}}

.hero{margin-bottom:36px;}
.hero h1{font-size:40px; margin:0 0 8px; color:var(--text);}
.hero p{font-size:15px; color:var(--text-secondary); margin:0; font-weight:500;}

.stats{display:grid; grid-template-columns:repeat(auto-fit, minmax(200px,1fr)); gap:12px; margin:28px 0 40px;}
.stat{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:20px; box-shadow:var(--shadow-sm); transition:all .3s var(--ease);}
.stat:hover{transform:translateY(-4px); box-shadow:var(--shadow-md); border-color:var(--border-strong);}
.stat-num{font-family:'Inter'; font-size:32px; font-weight:800; color:var(--accent); margin-bottom:4px;}
.stat-label{font-size:12px; color:var(--text-secondary); font-weight:700; letter-spacing:.02em; text-transform:uppercase;}

.section-title{font-size:20px; font-weight:800; margin:36px 0 16px; color:var(--text);}
.grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:16px;}
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:24px; box-shadow:var(--shadow-sm); transition:all .35s var(--ease); cursor:pointer; position:relative; overflow:hidden;}
.card::before{content:''; position:absolute; inset:0; background:radial-gradient(600px 400px at 90% 10%, rgba(0,113,227,.08), transparent); opacity:0; transition:opacity .3s var(--ease);}
.card:hover{transform:translateY(-6px); box-shadow:var(--shadow-md); border-color:var(--border-strong);}
.card:hover::before{opacity:1;}
.card-icon{width:48px; height:48px; border-radius:12px; background:linear-gradient(135deg, #f5f5f7, #efefef); display:flex; align-items:center; justify-content:center; font-size:22px; margin-bottom:12px;}
.card-title{font-size:16px; font-weight:700; color:var(--text); margin-bottom:4px;}
.card-count{font-size:13px; color:var(--text-secondary); margin-bottom:14px;}
.progress-bar{height:6px; border-radius:6px; background:rgba(0,0,0,.06); overflow:hidden; margin-bottom:8px;}
.progress-fill{height:100%; background:linear-gradient(90deg, var(--accent), var(--violet)); border-radius:6px; transition:width 1s var(--ease); position:relative;}
.progress-fill::after{content:''; position:absolute; inset:0; background:linear-gradient(100deg, transparent 30%, rgba(255,255,255,.4) 50%, transparent 70%); background-size:200% 100%; animation:shimmer 3s ease-in-out infinite;}
@keyframes shimmer{0%{background-position:200% 0;} 100%{background-position:-200% 0;}}
.progress-pct{font-size:11px; color:var(--text-tertiary); font-weight:700;}

.empty-state{text-align:center; padding:60px 24px; border:1px dashed var(--border); border-radius:var(--radius-lg); background:var(--surface-secondary); color:var(--text-secondary);}
.empty-icon{width:80px; height:80px; margin:0 auto 16px; font-size:32px; opacity:.8;}
.empty-title{font-size:16px; font-weight:700; color:var(--text); margin-bottom:6px;}
.empty-text{font-size:13px; color:var(--text-secondary); margin-bottom:20px; line-height:1.6;}

.btn{display:inline-flex; align-items:center; gap:8px; padding:12px 20px; border-radius:100px; border:none; font-weight:700; font-size:14px; transition:all .2s var(--ease); letter-spacing:-.01em;}
.btn:active{transform:scale(.95);}
.btn:hover{transform:translateY(-2px);}
.btn-primary{background:var(--accent); color:#fff; box-shadow:0 6px 16px rgba(0,113,227,.35);}
.btn-primary:hover{background:#0077ed; box-shadow:0 8px 20px rgba(0,113,227,.45); transform:translateY(-3px);}
.btn-secondary{background:var(--surface); color:var(--text); border:1px solid var(--border-strong); box-shadow:var(--shadow-xs);}
.btn-secondary:hover{background:var(--surface-secondary); border-color:var(--border-strong); box-shadow:var(--shadow-sm);}

.brand-icon{width:32px; height:32px; border-radius:10px; background:linear-gradient(140deg, #0071e3, #6e5de7); display:flex; align-items:center; justify-content:center; color:#fff; font-size:16px; font-weight:700; box-shadow:0 4px 12px rgba(0,113,227,.4); transition:all .3s var(--ease);}
.brand:hover .brand-icon{box-shadow:0 6px 16px rgba(0,113,227,.5);}

input, textarea{
  width:100%; background:var(--surface-secondary); border:1px solid var(--border-strong); border-radius:var(--radius-sm);
  padding:12px 14px; font-family:inherit; font-size:15px; color:var(--text); outline:none;
  transition:all .25s var(--ease);
}
input:focus, textarea:focus{border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-wash);}
.field{margin-bottom:16px;}
.field-label{display:block; font-size:12px; color:var(--text-secondary); margin:0 0 8px 2px; font-weight:700; letter-spacing:.01em;}

.modal{position:fixed; inset:0; z-index:200; display:none; align-items:center; justify-content:center; animation:modalFadeIn .25s var(--ease);}
.modal.active{display:flex;}
.modal-bg{position:absolute; inset:0; background:rgba(20,20,22,.35); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);}
.modal-box{position:relative; z-index:1; background:var(--surface); border-radius:var(--radius-lg); padding:32px; width:90%; max-width:480px; box-shadow:var(--shadow-lg); animation:modalSlideIn .3s var(--ease);}
@keyframes modalFadeIn{from{opacity:0;} to{opacity:1;}}
@keyframes modalSlideIn{from{transform:translateY(20px) scale(.95); opacity:0;} to{transform:translateY(0) scale(1); opacity:1;}}
.modal-close{position:absolute; top:16px; right:16px; width:32px; height:32px; background:none; border:none; color:var(--text-tertiary); cursor:pointer; font-size:20px; transition:all .2s var(--ease);}
.modal-close:hover{color:var(--text); transform:rotate(90deg);}
.modal-title{font-size:20px; font-weight:800; margin-bottom:20px; color:var(--text);}
.modal-actions{display:flex; gap:10px; justify-content:flex-end; margin-top:24px;}

@keyframes confettiFall{
  0%{opacity:1; transform:translateY(0) rotate(0deg) scale(1);}
  100%{opacity:0; transform:translateY(100vh) rotate(720deg) scale(0);}
}

@keyframes xpFly{
  0%{opacity:1; transform:translateY(0) scale(1);}
  100%{opacity:0; transform:translateY(-60px) scale(0.5);}
}

.flip-container{perspective:1200px; width:100%; height:400px; cursor:pointer;}
.flip-card{width:100%; height:100%; position:relative; transform-style:preserve-3d; transition:transform .6s cubic-bezier(.34,.85,.3,1);}
.flip-card.flipped{transform:rotateY(180deg);}
.card-face{position:absolute; inset:0; backface-visibility:hidden; border-radius:var(--radius-xl); padding:40px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; box-shadow:var(--shadow-md); border:1px solid var(--border);}
.card-face.front{background:linear-gradient(160deg, #fff, #f9f9fb); color:var(--text);}
.card-face.back{background:linear-gradient(160deg, #1d1d1f, #2a2a2d); color:#fff; transform:rotateY(180deg);}
.card-label{position:absolute; top:18px; right:22px; font-size:10px; font-weight:800; letter-spacing:.08em; opacity:.35; text-transform:uppercase;}
.card-text{font-size:24px; font-weight:700; line-height:1.6; word-break:break-word;}
.card-hint{position:absolute; bottom:20px; font-size:11px; opacity:.35; font-weight:600;}

.study-meta{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:24px;}
.meta-badge{display:flex; align-items:center; gap:6px; padding:8px 14px; border-radius:100px; background:var(--surface); border:1px solid var(--border); font-size:12px; font-weight:700;}

.rate-buttons{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:24px; opacity:0; pointer-events:none; transform:translateY(10px); transition:all .3s var(--ease);}
.rate-buttons.show{opacity:1; pointer-events:auto; transform:translateY(0);}
.rate-btn{padding:12px 6px; border-radius:14px; background:var(--surface); border:2px solid var(--border); font-size:12px; font-weight:700; text-align:center; transition:all .2s var(--ease);}
.rate-btn:hover{transform:translateY(-3px); box-shadow:var(--shadow-sm);}
.rate-btn:active{transform:scale(.95);}
.rate-btn.r1{border-color:rgba(255,59,48,.3); color:#ff3b30;}
.rate-btn.r1:hover{background:rgba(255,59,48,.1);}
.rate-btn.r2{border-color:rgba(255,149,0,.3); color:#ff9500;}
.rate-btn.r2:hover{background:rgba(255,149,0,.1);}
.rate-btn.r3{border-color:rgba(0,113,227,.3); color:#0071e3;}
.rate-btn.r3:hover{background:rgba(0,113,227,.1);}
.rate-btn.r4{border-color:rgba(47,179,80,.3); color:#2fb350;}
.rate-btn.r4:hover{background:rgba(47,179,80,.1);}

.card-icon{width:48px; height:48px; border-radius:12px; background:linear-gradient(135deg, #f5f5f7, #efefef); display:flex; align-items:center; justify-content:center; font-size:22px; margin-bottom:12px; transition:all .3s var(--ease);}
.card:hover .card-icon{transform:scale(1.1) rotate(-2deg);}

.toast{position:fixed; top:20px; left:50%; transform:translateX(-50%); background:var(--surface); border:1px solid var(--border-strong); color:var(--text); padding:12px 22px; border-radius:100px; font-size:13px; font-weight:700; box-shadow:var(--shadow-lg); z-index:300; animation:toastIn .35s var(--ease), toastOut .35s var(--ease) 2.65s forwards;}
@keyframes toastIn{from{opacity:0; transform:translateX(-50%) translateY(-12px) scale(.92);} to{opacity:1; transform:translateX(-50%) translateY(0) scale(1);}}
@keyframes toastOut{to{opacity:0; transform:translateX(-50%) translateY(-10px) scale(.95);}}

.achievement-unlock{position:fixed; inset:0; z-index:250; display:flex; align-items:center; justify-content:center; background:rgba(20,20,22,.5); backdrop-filter:blur(8px); opacity:0; pointer-events:none; transition:opacity .3s var(--ease);}
.achievement-unlock.show{opacity:1; pointer-events:auto;}
.achievement-card{background:var(--surface); border-radius:var(--radius-lg); padding:40px; text-align:center; box-shadow:var(--shadow-lg); animation:achvPop .4s var(--ease-bounce);}
@keyframes achvPop{from{transform:scale(.6); opacity:0;} to{transform:scale(1); opacity:1;}}
.achievement-icon{width:64px; height:64px; margin:0 auto 16px; font-size:32px;}
.achievement-text{font-size:16px; font-weight:800; color:var(--text); margin-bottom:4px;}
.achievement-desc{font-size:12px; color:var(--text-secondary);}

@media (max-width:700px){
  .grid{grid-template-columns:1fr;}
  .hero h1{font-size:28px;}
  .flip-container{height:300px;}
  .modal-box{width:95%; padding:24px;}
  .stats{grid-template-columns:repeat(2,1fr);}
}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01s !important; transition-duration:.01s !important;}
}
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="brand" onclick="nav('home')">
      <div class="brand-icon">💡</div>
      <span>فلش‌کوئست</span>
    </div>
    <div class="topbar-nav">
      <button class="nav-btn active" data-page="home" onclick="nav('home')">خانه</button>
      <button class="nav-btn" data-page="dashboard" onclick="nav('dashboard')">داشبورد</button>
    </div>
    <div class="streak" id="topStreak">🔥 0 روز</div>
  </header>

  <main class="main">
    <section class="view active" id="home-view"></section>
    <section class="view" id="topic-view"></section>
    <section class="view" id="study-view"></section>
    <section class="view" id="dashboard-view"></section>
  </main>
</div>

<div class="modal" id="topicModal">
  <div class="modal-bg" onclick="closeModal()"></div>
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-title">موضوع جدید</div>
    <div class="field">
      <label class="field-label">نام موضوع</label>
      <input type="text" id="topicName" placeholder="مثلاً: لغات انگلیسی">
    </div>
    <div class="field">
      <label class="field-label">انتخاب آیکون</label>
      <div style="display:flex; gap:8px; flex-wrap:wrap;" id="iconPicker"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">انصراف</button>
      <button class="btn btn-primary" onclick="saveTopic()">ایجاد</button>
    </div>
  </div>
</div>

<div class="modal" id="cardModal">
  <div class="modal-bg" onclick="closeModal()"></div>
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-title">کارت جدید</div>
    <div class="field">
      <label class="field-label">جلو (سؤال)</label>
      <textarea id="cardFront" placeholder="سؤال یا کلمه‌ی اصلی"></textarea>
    </div>
    <div class="field">
      <label class="field-label">پشت (جواب)</label>
      <textarea id="cardBack" placeholder="جواب و توضیح"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">انصراف</button>
      <button class="btn btn-primary" onclick="saveCard()">افزودن</button>
    </div>
  </div>
</div>

<div class="achievement-unlock" id="achvOverlay">
  <div class="achievement-card">
    <div class="achievement-icon" id="achvIcon">🎯</div>
    <div class="achievement-text" id="achvText">دستاورد</div>
    <div class="achievement-desc" id="achvDesc">تو رو تبریک می‌گم!</div>
  </div>
</div>

<div id="toastContainer" style="position:fixed; top:0; left:0; right:0; height:100px; z-index:300; pointer-events:none;"></div>

<script>
/* ============================= STORAGE ============================= */
const STORAGE_KEY = 'flashquest_data_v2';

function saveToLocal(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    return true;
  }catch(e){
    console.error('Storage error:', e);
    return false;
  }
}

function loadFromLocal(){
  try{
    const data = localStorage.getItem(STORAGE_KEY);
    return data ? JSON.parse(data) : null;
  }catch(e){
    console.error('Load error:', e);
    return null;
  }
}

function defaultState(){
  return {
    topics: [],
    stats: {
      xp: 0,
      streak: 0,
      lastStudy: null,
      todayCards: 0,
      dailyGoal: 20,
      totalCards: 0,
      achievements: []
    }
  };
}

let state = loadFromLocal() || defaultState();

/* ============================= SOUND DESIGN ============================= */
class SoundController {
  constructor(){
    this.audioContext = null;
    this.init();
  }
  
  init(){
    try{
      this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
      // Resume audio context on user interaction (browser requirement)
      if(this.audioContext.state === 'suspended'){
        document.addEventListener('click', () => this.resume(), { once: true });
        document.addEventListener('touchstart', () => this.resume(), { once: true });
      }
    }catch(e){
      console.log('Audio not available:', e);
    }
  }
  
  resume(){
    if(this.audioContext && this.audioContext.state === 'suspended'){
      this.audioContext.resume().then(() => {
        console.log('Audio context resumed');
      });
    }
  }

  play(type){
    if(!this.audioContext) return;
    
    // Try to resume if suspended
    if(this.audioContext.state === 'suspended'){
      this.audioContext.resume();
      return;
    }
    
    const ctx = this.audioContext;
    const now = ctx.currentTime;
    
    if(type === 'tap'){
      // Soft click sound
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const filter = ctx.createBiquadFilter();
      
      osc.type = 'triangle';
      osc.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(3000, now);
      filter.frequency.exponentialRampToValueAtTime(1000, now + 0.08);
      
      osc.frequency.setValueAtTime(600, now);
      osc.frequency.exponentialRampToValueAtTime(300, now + 0.08);
      
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
      
      osc.start(now);
      osc.stop(now + 0.08);
    }
    else if(type === 'success'){
      // Three rising tones with harmonics
      const notes = [523.25, 659.25, 783.99];
      notes.forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const filter = ctx.createBiquadFilter();
        
        osc.type = 'sine';
        osc.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(4000, now + i * 0.05);
        
        osc.frequency.setValueAtTime(freq, now + i * 0.05);
        
        gain.gain.setValueAtTime(0, now + i * 0.05);
        gain.gain.linearRampToValueAtTime(0.15, now + i * 0.05 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.05 + 0.12);
        
        osc.start(now + i * 0.05);
        osc.stop(now + i * 0.05 + 0.12);
      });
    }
    else if(type === 'flip'){
      // Swipe sound
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const filter = ctx.createBiquadFilter();
      
      osc.type = 'triangle';
      osc.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      
      filter.type = 'highpass';
      filter.frequency.setValueAtTime(2000, now);
      filter.frequency.linearRampToValueAtTime(4000, now + 0.12);
      
      osc.frequency.setValueAtTime(1200, now);
      osc.frequency.exponentialRampToValueAtTime(800, now + 0.12);
      
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
      
      osc.start(now);
      osc.stop(now + 0.12);
    }
    else if(type === 'levelup'){
      // Ascending fanfare
      const notes = [659.25, 783.99, 1046.50];
      notes.forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const filter = ctx.createBiquadFilter();
        
        osc.type = 'sine';
        osc.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(5000, now + i * 0.08);
        
        osc.frequency.setValueAtTime(freq, now + i * 0.08);
        
        gain.gain.setValueAtTime(0, now + i * 0.08);
        gain.gain.linearRampToValueAtTime(0.18, now + i * 0.08 + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.16);
        
        osc.start(now + i * 0.08);
        osc.stop(now + i * 0.08 + 0.16);
      });
    }
    else if(type === 'correct'){
      // Two rising affirming tones
      const notes = [783.99, 987.77];
      notes.forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const filter = ctx.createBiquadFilter();
        
        osc.type = 'sine';
        osc.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(4500, now + i * 0.1);
        
        osc.frequency.setValueAtTime(freq, now + i * 0.1);
        
        gain.gain.setValueAtTime(0, now + i * 0.1);
        gain.gain.linearRampToValueAtTime(0.16, now + i * 0.1 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.14);
        
        osc.start(now + i * 0.1);
        osc.stop(now + i * 0.1 + 0.14);
      });
    }
    else if(type === 'wrong'){
      // Descending error sound
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const filter = ctx.createBiquadFilter();
      
      osc.type = 'sine';
      osc.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(2000, now);
      filter.frequency.exponentialRampToValueAtTime(500, now + 0.2);
      
      osc.frequency.setValueAtTime(350, now);
      osc.frequency.exponentialRampToValueAtTime(150, now + 0.2);
      
      gain.gain.setValueAtTime(0.14, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
      
      osc.start(now);
      osc.stop(now + 0.2);
    }
    else if(type === 'delete'){
      // Quick descending beep
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const filter = ctx.createBiquadFilter();
      
      osc.type = 'triangle';
      osc.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(3000, now);
      filter.frequency.exponentialRampToValueAtTime(800, now + 0.12);
      
      osc.frequency.setValueAtTime(700, now);
      osc.frequency.exponentialRampToValueAtTime(300, now + 0.12);
      
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
      
      osc.start(now);
      osc.stop(now + 0.12);
    }
    else if(type === 'achievement'){
      // Celebratory chord
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const filter = ctx.createBiquadFilter();
        
        osc.type = 'sine';
        osc.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(5000, now);
        
        osc.frequency.setValueAtTime(freq, now + i * 0.03);
        
        gain.gain.setValueAtTime(0, now + i * 0.03);
        gain.gain.linearRampToValueAtTime(0.15, now + i * 0.03 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
        
        osc.start(now + i * 0.03);
        osc.stop(now + 0.25);
      });
    }
  }
}

function nav(page){
  // Hide all views
  document.querySelectorAll('.view').forEach(v => {
    v.classList.remove('active');
    v.style.display = '';
  });
  
  // Hide study view
  document.getElementById('study-view').classList.remove('active');
  document.getElementById('study-view').style.display = '';
  
  // Update nav buttons
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));

  // Show target view

    renderHome();
  }
  else if(page === 'dashboard'){
    document.getElementById('dashboard-view').classList.add('active');

function toast(msg){
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.getElementById('toastContainer').appendChild(el);
  setTimeout(() => el.remove(), 3100);
}

function showAchievement(name, desc, icon = '🎯'){
  document.getElementById('achvIcon').textContent = icon;
  document.getElementById('achvText').textContent = name;
  document.getElementById('achvDesc').textContent = desc;
  const overlay = document.getElementById('achvOverlay');
  overlay.classList.add('show');
  sound.play('achievement');
  burstConfetti(true);
  setTimeout(() => overlay.classList.remove('show'), 2500);

function burstConfetti(big = false){
  const colors = ['#0071e3', '#2fb350', '#ff9500', '#6e5de7', '#ff3b30'];
  const count = big ? 50 : 30;
  
  for(let i = 0; i < count; i++){
    const conf = document.createElement('div');
    conf.style.position = 'fixed';
    conf.style.width = big ? '12px' : '8px';
    conf.style.height = big ? '12px' : '8px';
    conf.style.background = colors[Math.floor(Math.random() * colors.length)];
    conf.style.left = Math.random() * 100 + '%';
    conf.style.top = '-20px';
    conf.style.borderRadius = '50%';
    conf.style.pointerEvents = 'none';
    conf.style.zIndex = '299';
    conf.style.boxShadow = '0 0 ' + (big ? '8px' : '4px') + ' currentColor';
    conf.style.animation = `confettiFall ${1.5 + Math.random() * 1}s linear forwards`;
    conf.style.filter = `hue-rotate(${Math.random() * 360}deg)`;
    document.body.appendChild(conf);
    
    setTimeout(() => conf.remove(), 3000);
  }
}

function flyXp(amount, x, y){
  const el = document.createElement('div');
  el.textContent = '+' + amount;
  el.style.position = 'fixed';
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  el.style.fontSize = '14px';
  el.style.fontWeight = '800';
  el.style.color = '#0071e3';
  el.style.pointerEvents = 'none';
  el.style.zIndex = '299';
  el.style.animation = 'xpFly .8s cubic-bezier(.34,1.56,.64,1) forwards';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 800);
}

function getMastery(topic){
  if(!topic.cards.length) return 0;
  const sum = topic.cards.reduce((a, c) => a + (c.level || 0), 0);
  return Math.round((sum / (topic.cards.length * 4)) * 100);
}

  topic.cards.push({ front, back, level: 0 });
  state.stats.totalCards++;
  
  saveToLocal();
  closeModal();
  viewTopic(topicId);
  toast('کارت اضافه شد ✨');
  sound.play('success');

function deleteCard(topicId, idx){
  if(confirm('مطمئن؟')) {
    const topic = state.topics.find(t => t.id === topicId);
    topic.cards.splice(idx, 1);
    state.stats.totalCards--;
    saveToLocal();
    viewTopic(topicId);
    toast('کارت حذف شد');
    sound.play('delete');
  }
}

/* ============================= STUDY VIEW ============================= */
function startStudy(topicId){
  const topic = state.topics.find(t => t.id === topicId);
  if(!topic || !topic.cards.length) return;
  
  window.currentStudy = {
    topicId,
    cards: [...topic.cards],
    idx: 0,
    flipped: false,
    studied: 0
  };
  
  renderStudy();
}

function renderStudy(){
  const { topicId, cards, idx, flipped } = window.currentStudy;
  const topic = state.topics.find(t => t.id === topicId);
  const card = cards[idx];
  const progress = Math.round((idx / cards.length) * 100);
  
  if(idx >= cards.length){
    endStudySession(topicId);
    return;
  }
  
  // Hide other views
  document.getElementById('home-view').classList.remove('active');
  document.getElementById('dashboard-view').classList.remove('active');
  document.getElementById('study-view').classList.add('active');
  
  document.getElementById('study-view').innerHTML = `
    <div style="max-width:700px; margin:0 auto;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <button class="btn btn-secondary" onclick="exitStudy()">خروج</button>
        <div class="meta-badge">${topic.icon} ${topic.name}</div>
        <div class="meta-badge">${idx + 1} / ${cards.length}</div>
      </div>
      
      <div style="height:6px; background:var(--border); border-radius:6px; margin-bottom:32px; overflow:hidden;">
        <div style="height:100%; width:${progress}%; background:linear-gradient(90deg, var(--accent), var(--violet)); transition:width .5s var(--ease);"></div>
      </div>

      <div class="flip-container" onclick="flipCard()">
        <div class="flip-card ${flipped ? 'flipped' : ''}">
          <div class="card-face front">
            <div class="card-label">سؤال</div>
            <div class="card-text">${card.front}</div>
            <div class="card-hint">برای دیدن جواب کلیک کن</div>
          </div>
          <div class="card-face back">
            <div class="card-label">جواب</div>
            <div class="card-text">${card.back}</div>
          </div>
        </div>
      </div>

      <div style="display:flex; justify-content:center; gap:10px; margin-top:24px;">
        <button class="btn btn-secondary" onclick="prevCard()" ${idx === 0 ? 'disabled' : ''}>←</button>
        <button class="btn btn-secondary" onclick="nextCardForce()">→</button>
      </div>

      ${flipped ? `
        <div class="rate-buttons show">
          <button class="rate-btn r1" onclick="rateCard(1)">😵<br>نفهمیدم</button>
          <button class="rate-btn r2" onclick="rateCard(2)">😬<br>سخت</button>
          <button class="rate-btn r3" onclick="rateCard(3)">🙂<br>بلدم</button>
          <button class="rate-btn r4" onclick="rateCard(4)">🤩<br>عالی</button>
        </div>
      ` : ''}
    </div>
  `;
}

function flipCard(){
  window.currentStudy.flipped = !window.currentStudy.flipped;
  renderStudy();
  sound.play('flip');
}

function nextCardForce(){
  if(window.currentStudy.flipped) window.currentStudy.flipped = false;
  window.currentStudy.idx++;
  renderStudy();
}

function prevCard(){
  if(window.currentStudy.idx > 0) {
    window.currentStudy.idx--;
    window.currentStudy.flipped = false;
    renderStudy();
  }
}

function rateCard(rating){
  const { cards, idx } = window.currentStudy;
  cards[idx].level = Math.min(4, cards[idx].level + rating - 1);
  
  state.stats.xp += (rating * 10);
  state.stats.todayCards++;
  window.currentStudy.studied++;
  
  // Different sounds for different ratings
  if(rating === 1){
    sound.play('wrong');
  } else if(rating === 2){
    sound.play('tap');
  } else if(rating === 3){
    sound.play('correct');
  } else if(rating === 4){
    sound.play('success');
    burstConfetti();
  }
  
  window.currentStudy.flipped = false;
  window.currentStudy.idx++;
  
  saveToLocal();
  renderStudy();
}

function endStudySession(topicId){
  const topic = state.topics.find(t => t.id === topicId);
  const studied = window.currentStudy.studied;
  
  document.getElementById('study-view').innerHTML = `

            </div>
          </div>
          <div style="font-size:12px; font-weight:700; color:var(--text-secondary); min-width:40px; text-align:right;">${getMastery(t)}%</div>
        </div>
      `).join('')}
    </div>
  `;
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('topicModal').onclick = (e) => {
    if(e.target.id === 'topicModal') closeModal();
  };
  document.getElementById('cardModal').onclick = (e) => {
    if(e.target.id === 'cardModal') closeModal();
  };
  
  document.getElementById('topicName').addEventListener('keypress', (e) => {
    if(e.key === 'Enter') saveTopic();
  });
  
  renderHome();
  document.getElementById('topStreak').textContent = `🔥 ${state.stats.streak} روز`;
});

document.addEventListener('keydown', (e) => {
  if(e.code === 'Space' && window.currentStudy && document.getElementById('study-view').classList.contains('active')) {
    e.preventDefault();
    flipCard();
  }
});
</script>
