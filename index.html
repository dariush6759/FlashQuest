<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>فلش‌کوئست</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg: #f9f9fb;
  --bg-secondary: #ffffff;
  --surface: #ffffff;
  --surface-dim: #f5f5f7;
  --surface-light: #fafbfc;
  --text: #000;
  --text-secondary: #64646c;
  --text-tertiary: #8e8e93;
  --border: rgba(0,0,0,.06);
  --border-strong: rgba(0,0,0,.1);

  --accent: #0071e3;
  --accent-light: #4fa3ff;
  --accent-lighter: #a8d5ff;
  --accent-wash: rgba(0,113,227,.1);
  
  --success: #32b76f;
  --success-light: #5ecc7a;
  --success-wash: rgba(50,183,111,.1);
  
  --warning: #ff9500;
  --warning-wash: rgba(255,149,0,.1);
  
  --danger: #ff3b30;
  --danger-light: #ff6b66;
  --danger-wash: rgba(255,59,48,.1);
  
  --violet: #6e5de7;
  --violet-light: #8a7bff;
  --violet-wash: rgba(110,93,231,.1);

  --ease: cubic-bezier(.25,.46,.45,.94);
  --ease-spring: cubic-bezier(.17,.67,.83,.67);
  --ease-out: cubic-bezier(.2,.8,.3,1);
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Vazirmatn', 'Segoe UI', sans-serif;
  font-size: 16px;
  line-height: 1.6;
  -webkit-user-select: none;
  user-select: none;
  overflow-x: hidden;
}

body {
  min-height: 100vh;
  background: linear-gradient(135deg, #f9f9fb 0%, #fafbfc 50%, #f5f7fc 100%);
}

::selection { background: var(--accent-lighter); }

h1, h2, h3, h4, h5, h6 {
  font-weight: 700;
  letter-spacing: -0.02em;
  margin: 0;
}

.app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  position: relative;
}

/* ===== TOPBAR ===== */
.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  padding: 10px 16px;
  background: rgba(255,255,255,.4);
  backdrop-filter: blur(30px);
  -webkit-backdrop-filter: blur(30px);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 52px;
  gap: 12px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 18px;
  font-weight: 900;
  letter-spacing: -0.02em;
  cursor: pointer;
  transition: transform 0.2s var(--ease);
  flex-shrink: 0;
}

.brand:active { transform: scale(0.94); }

.brand-icon {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: linear-gradient(135deg, #0071e3 0%, #6e5de7 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 18px;
  font-weight: 800;
  box-shadow: 0 4px 16px rgba(0,113,227,.3);
  transition: box-shadow 0.3s var(--ease);
}

.brand:hover .brand-icon {
  box-shadow: 0 6px 20px rgba(0,113,227,.4);
}

.topbar-nav {
  display: flex;
  gap: 4px;
  background: rgba(255,255,255,.5);
  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
  padding: 5px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,.4);
}

.nav-btn {
  padding: 6px 12px;
  border: none;
  border-radius: 8px;
  background: transparent;
  color: var(--text-secondary);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: -0.01em;
  cursor: pointer;
  transition: all 0.2s var(--ease);
  text-transform: capitalize;
}

.nav-btn.active {
  background: var(--surface);
  color: var(--text);
  box-shadow: 0 2px 12px rgba(0,0,0,.08);
}

.streak {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: 10px;
  background: var(--warning-wash);
  border: 1px solid rgba(255,149,0,.2);
  font-size: 12px;
  font-weight: 700;
  color: var(--warning);
  flex-shrink: 0;
}

.flame { animation: flamePulse 2s ease-in-out infinite; }
@keyframes flamePulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

.main {
  flex: 1;
  padding: 24px 16px 140px;
  max-width: 920px;
  margin: 0 auto;
  width: 100%;
}

.view {
  display: none;
  opacity: 0;
  transform: translateY(8px);
  animation: viewIn 0.4s var(--ease) forwards;
}

.view.active { display: block; }

@keyframes viewIn { to { opacity: 1; transform: translateY(0); } }

/* ===== HERO ===== */
.hero {
  margin-bottom: 36px;
}

.hero h1 {
  font-size: 36px;
  margin-bottom: 6px;
  background: linear-gradient(135deg, var(--text), var(--text-secondary));
  background-clip: text;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.hero p {
  font-size: 15px;
  color: var(--text-secondary);
  font-weight: 500;
  max-width: 400px;
}

/* ===== STATS GRID ===== */
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 12px;
  margin: 32px 0 44px;
}

.stat {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 18px;
  box-shadow: 0 1px 3px rgba(0,0,0,.04);
  transition: all 0.3s var(--ease);
  cursor: pointer;
  position: relative;
  overflow: hidden;
}

.stat::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(600px 400px at 90% 10%, rgba(0,113,227,.05), transparent);
  opacity: 0;
  transition: opacity 0.3s var(--ease);
}

.stat:active {
  transform: scale(0.96);
  box-shadow: 0 4px 12px rgba(0,0,0,.08);
}

.stat-num {
  font-family: 'SF Pro Display', -apple-system, sans-serif;
  font-size: 32px;
  font-weight: 900;
  background: linear-gradient(135deg, var(--accent), var(--violet));
  background-clip: text;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 4px;
  letter-spacing: -0.02em;
}

.stat-label {
  font-size: 11px;
  color: var(--text-secondary);
  font-weight: 700;
  letter-spacing: 0.02em;
  text-transform: uppercase;
}

/* ===== SECTION HEADER ===== */
.section-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 40px 0 18px;
  gap: 12px;
}

.section-title {
  font-size: 20px;
  font-weight: 800;
  color: var(--text);
  margin: 0;
}

/* ===== GRID ===== */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
  gap: 12px;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 18px;
  box-shadow: 0 1px 3px rgba(0,0,0,.04);
  cursor: pointer;
  transition: all 0.3s var(--ease);
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(600px 400px at 90% 10%, rgba(0,113,227,.05), transparent);
  opacity: 0;
  transition: opacity 0.3s var(--ease);
}

.card:active {
  transform: scale(0.96);
  box-shadow: 0 4px 12px rgba(0,0,0,.08);
  border-color: var(--accent-lighter);
}

.card-icon {
  width: 48px;
  height: 48px;
  border-radius: 14px;
  background: linear-gradient(135deg, #f0f0f2, #e8e8ec);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  margin-bottom: 12px;
  transition: transform 0.2s var(--ease);
}

.card:active .card-icon { transform: scale(0.88); }

.card-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 3px;
  line-height: 1.3;
}

.card-meta {
  font-size: 12px;
  color: var(--text-secondary);
  margin-bottom: 12px;
  display: flex;
  justify-content: space-between;
}

.progress-bar {
  height: 5px;
  border-radius: 5px;
  background: var(--surface-dim);
  overflow: hidden;
  margin-bottom: 7px;
  position: relative;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--violet));
  border-radius: 5px;
  transition: width 1s var(--ease);
  position: relative;
  box-shadow: 0 0 8px rgba(0,113,227,.4);
}

.progress-pct {
  font-size: 11px;
  color: var(--text-secondary);
  font-weight: 700;
  display: flex;
  justify-content: space-between;
}

/* ===== EMPTY STATE ===== */
.empty-state {
  text-align: center;
  padding: 70px 30px;
  border: 2px dashed var(--border-strong);
  border-radius: 24px;
  background: linear-gradient(135deg, var(--surface), var(--surface-light));
  color: var(--text-secondary);
}

.empty-icon {
  font-size: 56px;
  margin-bottom: 14px;
  opacity: 0.7;
  display: inline-block;
  animation: float 3s ease-in-out infinite;
}

@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

.empty-title {
  font-size: 17px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 6px;
}

.empty-text {
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 24px;
  line-height: 1.6;
}

/* ===== BUTTONS ===== */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 10px 16px;
  border: none;
  border-radius: 12px;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s var(--ease);
  letter-spacing: -0.01em;
  position: relative;
  overflow: hidden;
}

.btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(600px 400px at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(255,255,255,.3), transparent);
  opacity: 0;
  transition: opacity 0.3s;
}

.btn:active { transform: scale(0.94); }

.btn-primary {
  background: linear-gradient(135deg, var(--accent), var(--accent-light));
  color: #fff;
  box-shadow: 0 4px 16px rgba(0,113,227,.3);
  font-weight: 700;
}

.btn-primary:active {
  box-shadow: 0 2px 8px rgba(0,113,227,.2);
}

.btn-secondary {
  background: rgba(255,255,255,.6);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  color: var(--text);
  border: 1px solid rgba(255,255,255,.4);
  box-shadow: 0 1px 3px rgba(0,0,0,.04);
}

.btn-secondary:active {
  background: rgba(255,255,255,.5);
  border-color: var(--border-strong);
}

.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* ===== MODAL ===== */
.modal {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

.modal.active {
  display: flex;
  animation: modalFadeIn 0.25s var(--ease);
}

@keyframes modalFadeIn { from { opacity: 0; } to { opacity: 1; } }

.modal-bg {
  position: absolute;
  inset: 0;
  background: rgba(20,20,22,.35);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

.modal-box {
  position: relative;
  z-index: 1;
  background: rgba(255,255,255,.96);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,.7);
  border-radius: 28px;
  padding: 32px;
  width: 100%;
  max-width: 480px;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 25px 70px rgba(0,0,0,.2);
  animation: modalSlideIn 0.35s var(--ease-spring);
}

@keyframes modalSlideIn { from { transform: translateY(30px) scale(0.94); opacity: 0; } to { transform: translateY(0) scale(1); opacity: 1; } }

.modal-close {
  position: absolute;
  top: 14px;
  right: 14px;
  width: 36px;
  height: 36px;
  background: rgba(0,0,0,.05);
  border: none;
  border-radius: 10px;
  color: var(--text-secondary);
  cursor: pointer;
  font-size: 20px;
  transition: all 0.2s var(--ease);
  display: flex;
  align-items: center;
  justify-content: center;
}

.modal-close:active { background: rgba(0,0,0,.1); transform: rotate(90deg); }

.modal-title {
  font-size: 20px;
  font-weight: 800;
  margin-bottom: 22px;
  color: var(--text);
}

.modal-actions {
  display: flex;
  gap: 10px;
  justify-content: flex-end;
  margin-top: 24px;
}

/* ===== FORM ===== */
.field {
  margin-bottom: 18px;
}

.field-label {
  display: block;
  font-size: 12px;
  color: var(--text-secondary);
  margin-bottom: 8px;
  font-weight: 700;
  letter-spacing: 0.01em;
  text-transform: uppercase;
}

input, textarea {
  width: 100%;
  background: rgba(255,255,255,.6);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1.5px solid var(--border);
  border-radius: 14px;
  padding: 12px 14px;
  font-family: inherit;
  font-size: 15px;
  color: var(--text);
  outline: none;
  transition: all 0.2s var(--ease);
  resize: vertical;
}

input:focus, textarea:focus {
  background: rgba(255,255,255,.8);
  border-color: var(--accent);
  box-shadow: 0 0 0 4px var(--accent-wash);
}

/* ===== FLIP CARD ===== */
.flip-container {
  perspective: 1200px;
  width: 100%;
  height: 420px;
  cursor: pointer;
  margin: 24px 0;
}

.flip-card {
  width: 100%;
  height: 100%;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.65s cubic-bezier(.34,.85,.3,1);
}

.flip-card.flipped { transform: rotateY(180deg); }

.card-face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  border-radius: 24px;
  padding: 48px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  border: 1.5px solid var(--border);
  box-shadow: 0 15px 40px rgba(0,0,0,.12);
  transition: all 0.3s var(--ease);
}

.card-face.front {
  background: linear-gradient(135deg, #fff 0%, #f9f9fb 100%);
  color: var(--text);
}

.card-face.back {
  background: linear-gradient(135deg, #1a1a1e 0%, #2d2d33 100%);
  color: #fff;
  transform: rotateY(180deg);
}

.card-label {
  position: absolute;
  top: 18px;
  right: 22px;
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.1em;
  opacity: 0.3;
  text-transform: uppercase;
}

.card-text {
  font-size: 24px;
  font-weight: 700;
  line-height: 1.7;
  word-break: break-word;
  letter-spacing: -0.02em;
}

.card-hint {
  position: absolute;
  bottom: 20px;
  font-size: 11px;
  opacity: 0.4;
  font-weight: 600;
  animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.7; } }

/* ===== STUDY UI ===== */
.study-meta {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.meta-badge {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 7px 13px;
  border-radius: 12px;
  background: rgba(255,255,255,.6);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--border);
  font-size: 12px;
  font-weight: 700;
  color: var(--text-secondary);
  box-shadow: 0 1px 3px rgba(0,0,0,.04);
}

.progress-track {
  height: 5px;
  background: var(--surface-dim);
  border-radius: 5px;
  margin-bottom: 24px;
  overflow: hidden;
  box-shadow: 0 1px 3px rgba(0,0,0,.04);
}

.progress-indicator {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--violet));
  border-radius: 5px;
  transition: width 0.5s var(--ease);
  position: relative;
}

.progress-indicator::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.4) 50%, transparent 70%);
  background-size: 200% 100%;
  animation: shimmer 3s ease-in-out infinite;
}

@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

.rate-buttons {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-top: 24px;
  opacity: 0;
  pointer-events: none;
  transform: translateY(12px);
  transition: all 0.3s var(--ease);
}

.rate-buttons.show {
  opacity: 1;
  pointer-events: auto;
  transform: translateY(0);
}

.rate-btn {
  padding: 12px 8px;
  border-radius: 14px;
  background: rgba(255,255,255,.7);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1.5px solid var(--border);
  font-size: 12px;
  font-weight: 700;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s var(--ease);
  color: var(--text);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
}

.rate-btn:active { transform: scale(0.92); }

.rate-btn.r1 { border-color: rgba(255,59,48,.2); color: #ff3b30; }
.rate-btn.r1:active { background: var(--danger-wash); }
.rate-btn.r2 { border-color: rgba(255,149,0,.2); color: #ff9500; }
.rate-btn.r2:active { background: var(--warning-wash); }
.rate-btn.r3 { border-color: rgba(0,113,227,.2); color: #0071e3; }
.rate-btn.r3:active { background: var(--accent-wash); }
.rate-btn.r4 { border-color: rgba(50,183,111,.2); color: #32b76f; }
.rate-btn.r4:active { background: var(--success-wash); }

.rate-emoji {
  font-size: 20px;
  line-height: 1;
}

/* ===== TOAST ===== */
.toast {
  position: fixed;
  bottom: 100px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,.85);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,.15);
  color: #fff;
  padding: 12px 20px;
  border-radius: 14px;
  font-size: 13px;
  font-weight: 700;
  z-index: 300;
  animation: toastIn 0.3s var(--ease), toastOut 0.3s var(--ease) 2.7s forwards;
}

@keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(10px) scale(0.92); } to { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); } }
@keyframes toastOut { to { opacity: 0; transform: translateX(-50%) translateY(10px) scale(0.95); } }

/* ===== ACHIEVEMENT ===== */
.achievement-overlay {
  position: fixed;
  inset: 0;
  z-index: 250;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(20,20,22,.4);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s var(--ease);
}

.achievement-overlay.show {
  opacity: 1;
  pointer-events: auto;
}

.achievement-box {
  background: rgba(255,255,255,.96);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,.7);
  border-radius: 28px;
  padding: 44px 40px;
  text-align: center;
  box-shadow: 0 25px 70px rgba(0,0,0,.2);
  animation: achvPop 0.4s cubic-bezier(.17,.67,.83,.67) forwards;
  max-width: 400px;
}

@keyframes achvPop { from { transform: scale(0.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }

.achievement-icon {
  width: 70px;
  height: 70px;
  margin: 0 auto 16px;
  font-size: 36px;
  animation: achvFloat 0.6s var(--ease-spring);
}

@keyframes achvFloat { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

.achievement-text {
  font-size: 18px;
  font-weight: 800;
  color: var(--text);
  margin-bottom: 6px;
}

.achievement-desc {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.5;
}

/* ===== CONFETTI ===== */
@keyframes confettiFall {
  0% { opacity: 1; transform: translateY(0) rotate(0deg) scale(1); }
  100% { opacity: 0; transform: translateY(100vh) rotate(720deg) scale(0); }
}

}
</style>

<body>

  </div>
</div>

<div id="toastContainer" style="position:fixed; bottom:0; left:0; right:0; height:200px; z-index:300; pointer-events:none;"></div>

<script>
/* ===== STATE & STORAGE ===== */
const STORAGE_KEY = 'flashquest_premium_v1';

function defaultState(){
  return {
    topics: [],
    stats: {
      xp: 0,
      streak: 0,
      level: 0,
      todayCards: 0,
      totalCards: 0,
      totalSessions: 0,
      lastStudy: null,
      totalXP: 0,
      achievements: [],
      cardStats: {}
    }
  };
}

let state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || defaultState();

function save(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

/* ===== SOUND ===== */
class SoundController {
  constructor(){
    this.ctx = null;
    this.init();
  }
  
  init(){
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      document.addEventListener('click', () => this.resume(), { once: true });
      document.addEventListener('touchstart', () => this.resume(), { once: true });
    }catch(e){ console.log('Audio: ', e); }
  }
  
  resume(){
    if(this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  }

  play(type){
    if(!this.ctx) return;
    if(this.ctx.state === 'suspended'){ this.resume(); return; }
    
    const now = this.ctx.currentTime;
    
    const makeTone = (freq, duration, startTime, gain = 0.15) => {
      const osc = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      const filter = this.ctx.createBiquadFilter();
      
      osc.type = 'sine';
      osc.connect(filter);
      filter.connect(g);
      g.connect(this.ctx.destination);
      
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(4000, startTime);
      
      osc.frequency.setValueAtTime(freq, startTime);
      g.gain.setValueAtTime(0, startTime);
      g.gain.linearRampToValueAtTime(gain, startTime + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
      
      osc.start(startTime);
      osc.stop(startTime + duration);
    };
    
    if(type === 'tap') makeTone(800, 0.08, now, 0.12);
    else if(type === 'flip') makeTone(1200, 0.1, now, 0.14);
    else if(type === 'success') {
      [523.25, 659.25, 783.99].forEach((f, i) => makeTone(f, 0.12, now + i * 0.05, 0.12));
    }
    else if(type === 'levelup') {
      [659.25, 783.99, 1046.50].forEach((f, i) => makeTone(f, 0.16, now + i * 0.08, 0.14));
    }
    else if(type === 'correct') {
      [783.99, 987.77].forEach((f, i) => makeTone(f, 0.14, now + i * 0.1, 0.13));
    }
    else if(type === 'wrong') makeTone(300, 0.2, now, 0.12);
    else if(type === 'achievement') {
      [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => makeTone(f, 0.08, now + i * 0.03, 0.14));
    }
  }
}

const sound = new SoundController();

/* ===== UTILITIES ===== */
function nav(page){
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`[data-page="${page}"]`)?.classList.add('active');
  
  const view = {
    home: 'home-view',
    stats: 'stats-view',
    achieve: 'achieve-view'
  }[page];
  
  if(view) document.getElementById(view).classList.add('active');
  
  if(page === 'home') renderHome();
  else if(page === 'stats') renderStats();
  else if(page === 'achieve') renderAchievements();
  
  sound.play('tap');
}

function toast(msg){
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.getElementById('toastContainer').appendChild(el);
  setTimeout(() => el.remove(), 3100);
}

function burstConfetti(count = 40){
  const colors = ['#0071e3', '#32b76f', '#ff9500', '#6e5de7', '#ff3b30'];
  for(let i = 0; i < count; i++){
    const el = document.createElement('div');
    el.style.cssText = `
      position: fixed;
      left: ${Math.random() * 100}%;
      top: -20px;
      width: ${8 + Math.random() * 6}px;
      height: ${8 + Math.random() * 6}px;
      background: ${colors[Math.floor(Math.random() * colors.length)]};
      border-radius: 50%;
      pointer-events: none;
      z-index: 299;
      box-shadow: 0 0 8px currentColor;
      animation: confettiFall ${1.5 + Math.random()}s linear forwards;
      filter: hue-rotate(${Math.random() * 360}deg);
    `;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3000);
  }
}

function showAchievement(name, desc, icon = '🎯'){
  document.getElementById('achvIcon').textContent = icon;
  document.getElementById('achvText').textContent = name;
  document.getElementById('achvDesc').textContent = desc;
  document.getElementById('achvOverlay').classList.add('show');
  sound.play('achievement');
  burstConfetti(60);
  setTimeout(() => document.getElementById('achvOverlay').classList.remove('show'), 2800);
}

function getMastery(topic){
  if(!topic.cards.length) return 0;
  return Math.round((topic.cards.reduce((a, c) => a + (c.level || 0), 0) / (topic.cards.length * 4)) * 100);
}

/* ===== HOME VIEW ===== */
function renderHome(){
  const stats = state.stats;
  const level = Math.floor(stats.totalXP / 100);
  
  document.getElementById('home-view').innerHTML = `
    <div class="hero">
      <h1>فلش‌کوئست 💡</h1>
      <p>یاد بگیری، پیشرفت کن، درخشان شو</p>
    </div>
    
    <div class="stats">
      <div class="stat">
        <div class="stat-num">${level}</div>
        <div class="stat-label">سطح</div>
      </div>
      <div class="stat">
        <div class="stat-num">${stats.totalXP}</div>
        <div class="stat-label">XP کل</div>
      </div>
      <div class="stat">
        <div class="stat-num">${stats.totalCards}</div>
        <div class="stat-label">کارت</div>
      </div>
      <div class="stat">
        <div class="stat-num">${stats.totalSessions}</div>
        <div class="stat-label">جلسه</div>
      </div>
    </div>

    <div class="section-header">
      <h2 class="section-title">موضوعات</h2>
      <button class="btn btn-primary" onclick="openTopicModal()">+ جدید</button>
    </div>

    ${state.topics.length === 0 ? `
      <div class="empty-state">
        <div class="empty-icon">📚</div>
        <div class="empty-title">هنوز موضوعی نساختی</div>
        <div class="empty-text">اولین موضوع رو بساز و شروع کن</div>
        <button class="btn btn-primary" onclick="openTopicModal()">ایجاد</button>
      </div>
    ` : `
      <div class="grid">
        ${state.topics.map(t => `
          <div class="card" onclick="viewTopic('${t.id}')">
            <div class="card-icon">${t.icon}</div>
            <div class="card-title">${t.name}</div>
            <div class="card-meta">
              <span>${t.cards.length} کارت</span>
              <span>${getMastery(t)}%</span>
            </div>
            <div class="progress-bar">
              <div class="progress-fill" style="width:${getMastery(t)}%"></div>
            </div>
            <div class="progress-pct">
              <span>تسلط</span>
              <span>${getMastery(t)}%</span>
            </div>
          </div>
        `).join('')}
      </div>
    `}
  `;
}

function openTopicModal(){
  document.getElementById('topicModal').classList.add('active');
  const icons = ['📚', '🧪', '🌍', '🎨', '🎵', '💻', '🧠', '🗣️', '📐', '🏛️', '🎭', '⚡', '🚀', '🌟', '💫', '🎯'];
  document.getElementById('iconPicker').innerHTML = icons.map(ic => 
    `<button style="width:100%; aspect-ratio:1; border-radius:12px; border:2px solid var(--border); background:var(--surface); font-size:24px; cursor:pointer; transition:all .2s; display:flex; align-items:center; justify-content:center;" 
    class="icon-opt" data-icon="${ic}" onclick="selectIcon(this)">${ic}</button>`
  ).join('');
}

function selectIcon(el){
  document.querySelectorAll('.icon-opt').forEach(e => e.style.borderColor = 'var(--border)');
  el.style.borderColor = 'var(--accent)';
  el.style.background = 'var(--accent-wash)';
}

function saveTopic(){
  const name = document.getElementById('topicName').value.trim();
  const icon = document.querySelector('.icon-opt[style*="accent"]')?.dataset.icon || '📚';
  
  if(!name) return;
  
  state.topics.push({ id: Date.now().toString(), name, icon, cards: [] });
  save();
  document.getElementById('topicModal').classList.remove('active');
  document.getElementById('topicName').value = '';
  renderHome();
  toast(`✨ "${name}" ایجاد شد`);
  sound.play('success');
}

function viewTopic(id){
  const topic = state.topics.find(t => t.id === id);
  if(!topic) return;
  
  document.getElementById('home-view').innerHTML = `
    <button class="btn btn-secondary" onclick="renderHome(); nav('home')" style="margin-bottom:20px;">← بازگشت</button>
    <div style="display:flex; gap:16px; align-items:center; margin-bottom:24px;">
      <span style="font-size:44px;">${topic.icon}</span>
      <div>
        <h1 style="font-size:28px; margin-bottom:4px;">${topic.name}</h1>
        <p style="margin:0; color:var(--text-secondary);">${topic.cards.length} کارت • ${getMastery(topic)}% تسلط</p>
      </div>
    </div>

    <div style="display:flex; gap:10px; margin-bottom:24px;">
      <button class="btn btn-primary" onclick="startStudy('${id}')" ${topic.cards.length === 0 ? 'disabled' : ''}>شروع مطالعه</button>
      <button class="btn btn-secondary" onclick="openCardModal('${id}')">+ کارت</button>
    </div>

    ${topic.cards.length === 0 ? `
      <div class="empty-state">
        <div class="empty-icon">🃏</div>
        <div class="empty-title">هنوز کارتی نیست</div>
        <div class="empty-text">اولین کارت رو اضافه کن</div>
      </div>
    ` : `
      <div style="display:grid; gap:10px;">
        ${topic.cards.map((c, i) => `
          <div style="background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:14px; display:flex; justify-content:space-between; align-items:center;">
            <div style="flex:1; min-width:0;">
              <div style="font-size:11px; color:var(--text-secondary); margin-bottom:3px; font-weight:700;">جلو</div>
              <div style="font-size:14px; color:var(--text); font-weight:600; margin-bottom:8px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${c.front}</div>
              <div style="font-size:11px; color:var(--text-secondary); margin-bottom:3px; font-weight:700;">پشت</div>
              <div style="font-size:14px; color:var(--text); overflow:hidden; text-overflow:ellipsis;">${c.back}</div>
            </div>
            <button class="btn btn-secondary" style="padding:8px; font-size:14px; margin-right:10px;" onclick="deleteCard('${id}', ${i})">🗑️</button>
          </div>
        `).join('')}
      </div>
    `}
  `;
}

function openCardModal(topicId){
  window.currentTopicId = topicId;
  document.getElementById('cardFront').value = '';
  document.getElementById('cardBack').value = '';
  document.getElementById('cardModal').classList.add('active');
}

function saveCard(){
  const front = document.getElementById('cardFront').value.trim();
  const back = document.getElementById('cardBack').value.trim();
  
  if(!front || !back) return;
  
  const topic = state.topics.find(t => t.id === window.currentTopicId);
  topic.cards.push({ front, back, level: 0 });
  state.stats.totalCards++;
  save();
  document.getElementById('cardModal').classList.remove('active');
  viewTopic(window.currentTopicId);
  toast('کارت اضافه شد ✨');
  sound.play('success');
}

function deleteCard(topicId, idx){
  if(confirm('مطمئن؟')) {
    const topic = state.topics.find(t => t.id === topicId);
    topic.cards.splice(idx, 1);
    state.stats.totalCards--;
    save();
    viewTopic(topicId);
    toast('کارت حذف شد');
    sound.play('delete');
  }
}

function closeModal(){
  document.getElementById('topicModal').classList.remove('active');
  document.getElementById('cardModal').classList.remove('active');
}

/* ===== STUDY ===== */
function startStudy(topicId){
  const topic = state.topics.find(t => t.id === topicId);
  if(!topic || !topic.cards.length) return;
  
  window.currentStudy = {
    topicId,
    cards: [...topic.cards].sort(() => Math.random() - 0.5),
    idx: 0,
    flipped: false,
    studied: 0
  };
  
  renderStudy();
}

function renderStudy(){
  const { topicId, cards, idx, flipped } = window.currentStudy;
  const topic = state.topics.find(t => t.id === topicId);
  const card = cards[idx];
  const progress = Math.round((idx / cards.length) * 100);
  
  if(idx >= cards.length){
    endStudySession(topicId);
    return;
  }
  
  document.getElementById('home-view').classList.remove('active');
  document.getElementById('study-view').classList.add('active');
  
  document.getElementById('study-view').innerHTML = `
    <div style="max-width:700px; margin:0 auto;">
      <div style="display:flex; justify-content:space-between; margin-bottom:18px;">
        <button class="btn btn-secondary" onclick="exitStudy()">خروج</button>
        <div class="meta-badge">${topic.icon} ${topic.name}</div>
        <div class="meta-badge">${idx + 1}/${cards.length}</div>
      </div>
      
      <div class="progress-track">
        <div class="progress-indicator" style="width:${progress}%"></div>
      </div>

      <div class="flip-container" onclick="flipCard()">
        <div class="flip-card ${flipped ? 'flipped' : ''}">
          <div class="card-face front">
            <div class="card-label">سؤال</div>
            <div class="card-text">${card.front}</div>
            <div class="card-hint">کلیک برای جواب</div>
          </div>
          <div class="card-face back">
            <div class="card-label">جواب</div>
            <div class="card-text">${card.back}</div>
          </div>
        </div>
      </div>

      <div style="display:flex; justify-content:center; gap:10px;">
        <button class="btn btn-secondary" onclick="prevCard()" ${idx === 0 ? 'disabled' : ''}>←</button>
        <button class="btn btn-secondary" onclick="nextCard()">→</button>
      </div>

      ${flipped ? `
        <div class="rate-buttons show">
          <button class="rate-btn r1" onclick="rateCard(1)"><div class="rate-emoji">😵</div><div>نفهمیدم</div></button>
          <button class="rate-btn r2" onclick="rateCard(2)"><div class="rate-emoji">😬</div><div>سخت</div></button>
          <button class="rate-btn r3" onclick="rateCard(3)"><div class="rate-emoji">🙂</div><div>بلدم</div></button>
          <button class="rate-btn r4" onclick="rateCard(4)"><div class="rate-emoji">🤩</div><div>عالی</div></button>
        </div>
      ` : ''}
    </div>
  `;
}

function flipCard(){
  window.currentStudy.flipped = !window.currentStudy.flipped;
  renderStudy();
  sound.play('flip');
}

function nextCard(){
  if(window.currentStudy.flipped) window.currentStudy.flipped = false;
  window.currentStudy.idx++;
  renderStudy();
}

function prevCard(){
  if(window.currentStudy.idx > 0) {
    window.currentStudy.idx--;
    window.currentStudy.flipped = false;
    renderStudy();
  }
}

function rateCard(rating){
  const { cards, idx } = window.currentStudy;
  cards[idx].level = Math.min(4, cards[idx].level + rating - 1);
  
  const xp = rating * 12;
  state.stats.totalXP += xp;
  state.stats.todayCards++;
  window.currentStudy.studied++;
  
  if(rating === 1) sound.play('wrong');
  else if(rating === 2) sound.play('tap');
  else if(rating === 3) sound.play('correct');
  else if(rating === 4){
    sound.play('success');
    burstConfetti(50);
  }
  
  window.currentStudy.flipped = false;
  window.currentStudy.idx++;
  
  save();
  renderStudy();
}

function endStudySession(topicId){
  const studied = window.currentStudy.studied;
  state.stats.totalSessions++;
  save();
  
  document.getElementById('study-view').innerHTML = `
    <div style="max-width:500px; margin:100px auto; text-align:center;">
      <div style="font-size:60px; margin-bottom:16px; animation:float 0.6s ease-out;">🎉</div>
      <h2 style="font-size:26px; margin:0 0 8px;">شگفت‌انگیز!</h2>
      <p style="color:var(--text-secondary); margin-bottom:32px; font-size:15px;">تو ${studied} کارت مطالعه کردی و <strong>${studied * 12} XP</strong> کسب کردی</p>
      
      <div class="stats" style="max-width:340px; margin:0 auto 32px;">
        <div class="stat">
          <div class="stat-num">${studied}</div>
          <div class="stat-label">کارت</div>
        </div>
        <div class="stat">
          <div class="stat-num">+${studied * 12}</div>
          <div class="stat-label">XP</div>
        </div>
      </div>

      <div style="display:flex; gap:10px; justify-content:center;">
        <button class="btn btn-secondary" onclick="exitStudy()">خانه</button>
        <button class="btn btn-primary" onclick="startStudy('${topicId}')">مجدد</button>
      </div>
    </div>
  `;
  
  sound.play('levelup');
  showAchievement('جلسه تمام!', 'عالی کاری کردی', '🏆');
}

function exitStudy(){
  window.currentStudy = null;
  document.getElementById('study-view').classList.remove('active');
  document.getElementById('study-view').innerHTML = '';
  nav('home');
}

/* ===== STATS VIEW ===== */
function renderStats(){
  const stats = state.stats;
  const level = Math.floor(stats.totalXP / 100);
  
  document.getElementById('stats-view').innerHTML = `
    <div class="hero">
      <h1>آمار و ارقام 📊</h1>
      <p>پیشرفتت رو ببین</p>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-num">${level}</div>
        <div class="stat-label">سطح</div>
      </div>
      <div class="stat">
        <div class="stat-num">${stats.totalXP}</div>
        <div class="stat-label">XP کل</div>
      </div>
      <div class="stat">
        <div class="stat-num">${stats.streak}</div>
        <div class="stat-label">روز متوالی</div>
      </div>
      <div class="stat">
        <div class="stat-num">${stats.totalSessions}</div>
        <div class="stat-label">جلسه</div>
      </div>
    </div>

    <div class="section-header">
      <h2 class="section-title">موضوعات</h2>
    </div>
    <div style="display:grid; gap:12px;">
      ${state.topics.length === 0 ? '<p style="text-align:center; color:var(--text-secondary); padding:40px;">هنوز موضوعی وجود ندارد</p>' : state.topics.map(t => `
        <div style="background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:16px; display:flex; align-items:center; gap:14px;">
          <span style="font-size:24px;">${t.icon}</span>
          <div style="flex:1;">
            <div style="font-weight:700; color:var(--text); margin-bottom:6px;">${t.name}</div>
            <div class="progress-bar">
              <div class="progress-fill" style="width:${getMastery(t)}%"></div>
            </div>
            <div style="font-size:12px; color:var(--text-secondary);">${t.cards.length} کارت • ${getMastery(t)}% تسلط</div>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

/* ===== ACHIEVEMENTS ===== */
const achievements = [
  { id: 'first_topic', name: 'شروع', desc: 'اولین موضوع رو ایجاد کن', icon: '📚', check: () => state.topics.length >= 1 },
  { id: 'ten_cards', name: 'کار سخت', desc: '۱۰ کارت بساز', icon: '🃏', check: () => state.stats.totalCards >= 10 },
  { id: 'fifty_cards', name: 'مجموعه‌دار', desc: '۵۰ کارت بساز', icon: '📦', check: () => state.stats.totalCards >= 50 },
  { id: 'hundred_xp', name: 'صعود', desc: '۱۰۰ XP کسب کن', icon: '⚡', check: () => state.stats.totalXP >= 100 },
  { id: 'thousand_xp', name: 'اسطوره', desc: '۱۰۰۰ XP کسب کن', icon: '🌟', check: () => state.stats.totalXP >= 1000 },
  { id: 'level_five', name: 'سطح ۵', desc: 'سطح ۵ به‌دست آور', icon: '🚀', check: () => Math.floor(state.stats.totalXP / 100) >= 5 },
  { id: 'ten_sessions', name: 'ثابت‌قدم', desc: '۱۰ جلسه انجام بده', icon: '🎯', check: () => state.stats.totalSessions >= 10 },
  { id: 'five_topics', name: 'جمع‌آوری', desc: '۵ موضوع بساز', icon: '🏆', check: () => state.topics.length >= 5 },
];

function renderAchievements(){
  const unlocked = achievements.filter(a => a.check() && !state.stats.achievements.includes(a.id));
  unlocked.forEach(a => {
    if(!state.stats.achievements.includes(a.id)){
      state.stats.achievements.push(a.id);
      save();
      setTimeout(() => showAchievement(a.name, a.desc, a.icon), 500);
    }
  });
  
  document.getElementById('achieve-view').innerHTML = `
    <div class="hero">
      <h1>دستاوردها 🏅</h1>
      <p>به‌دست‌آوردهای تو</p>
    </div>

    <div style="display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:14px;">
      ${achievements.map(a => {
        const isUnlocked = state.stats.achievements.includes(a.id);
        return `
          <div style="background:var(--surface); border:2px solid ${isUnlocked ? 'var(--accent)' : 'var(--border)'}; border-radius:18px; padding:20px; text-align:center; cursor:pointer; transition:all .3s; opacity:${isUnlocked ? '1' : '0.5'};">
            <div style="font-size:40px; margin-bottom:8px;">${a.icon}</div>
            <div style="font-size:14px; font-weight:700; color:var(--text); margin-bottom:2px;">${a.name}</div>
            <div style="font-size:11px; color:var(--text-secondary);">${a.desc}</div>
            ${isUnlocked ? '<div style="margin-top:8px; font-size:10px; color:var(--success); font-weight:700;">✓ حاصل شد</div>' : ''}
          </div>
        `;
      }).join('')}
    </div>
  `;
}

/* ===== INIT ===== */
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('topicModal').onclick = (e) => { if(e.target.id === 'topicModal') closeModal(); };
  document.getElementById('cardModal').onclick = (e) => { if(e.target.id === 'cardModal') closeModal(); };
  
  document.getElementById('topicName').addEventListener('keypress', (e) => {
    if(e.key === 'Enter') saveTopic();
  });
  
  renderHome();
  document.getElementById('topStreak').textContent = state.stats.streak;
});

document.addEventListener('keydown', (e) => {
  if(e.code === 'Space' && window.currentStudy && document.getElementById('study-view').classList.contains('active')) {
    e.preventDefault();
    flipCard();
  }
});
</script>
</body>
</html>
